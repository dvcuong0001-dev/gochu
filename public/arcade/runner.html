<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>runner</title>
<link rel="stylesheet" href="fonts/runner.css">
<style>
/* ===== Tuhoc Typing · bộ khung game 3D (mỗi game đổi biến màu/font ở :root của riêng nó) ===== */
:root{ --vh:1vh; --vw:1vw;
  --bg:#05070c; --ink:#eef4ff; --muted:#9aaccb; --acc:#5ef0ff; --acc2:#ffb547; --bad:#ff4d5e; --good:#6dff9e;
  --oncyc:#041018; --glass:rgba(8,12,20,.76); --line:rgba(150,200,255,.2); --tagbg:rgba(6,12,20,.82);
  --display:'Chakra Petch',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif; --mono:'JetBrains Mono','Cascadia Mono',Consolas,ui-monospace,monospace;
  --rad:0px; --glow:rgba(94,240,255,.55); --dtrans:uppercase; --dls:.03em;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#tags,#fxl,#lockl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#lines line{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 6;opacity:.75;filter:drop-shadow(0 0 4px var(--glow))}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0}
.eyebrow{font:600 11px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}

/* ---- nhãn chữ trên mục tiêu ---- */
.tag{position:absolute;left:0;top:0;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform;transition:opacity .15s}
.tag .w{font:700 17px/1.32 var(--mono);padding:4px 9px 3px;background:var(--tagbg);border:1px solid var(--line);color:var(--ink);white-space:pre;border-radius:var(--rad);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tag .w b{color:var(--acc);text-shadow:0 0 10px var(--glow)}
.tag .w .nx{background:var(--acc);color:var(--oncyc);border-radius:2px}
.tag .d{font:600 10.5px/1.2 var(--mono);color:#c9d3e3;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 3px #000}
.tag.on .w{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px var(--glow)}
.tag.hot .w{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad),0 0 20px rgba(255,77,94,.5)}
.tag.hot .d{color:var(--bad)}
.tag.gold .w{border-color:var(--acc2);color:#fff3d6}
.tag.gold .d{color:var(--acc2)}
.tag.bad .w{border-color:var(--bad);background:rgba(40,6,10,.85)}
.tag.bad .d{color:var(--bad)}
.tag.boss .w{font-size:21px;border-color:var(--bad)}
.tag.big .w{font-size:24px;padding:6px 12px 4px}
.tag.dim{opacity:.4}

/* ---- tâm ngắm ---- */
#lock{position:absolute;left:0;top:0;width:100px;height:100px;--rc:var(--acc)}
#lock.hot{--rc:var(--bad)}
#lock svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px var(--glow))}
#lock svg *{fill:none;stroke:var(--rc);vector-effect:non-scaling-stroke}
#lock .ro path{stroke-width:2.2}
#lock .ri circle{stroke-width:1;stroke-dasharray:2 5;opacity:.7}
#lock .pg{stroke-width:3;stroke-linecap:round;stroke-dasharray:0 100}
#lock .br path{stroke-width:2.4}
#lock .ro,#lock .ri,#lock .br{transform-box:view-box;transform-origin:center}

/* ---- hiệu ứng chữ ---- */
.pop{position:absolute;left:0;top:0;font:700 18px/1.2 var(--display);color:var(--acc2);text-shadow:0 0 12px rgba(0,0,0,.6);animation:rise .9s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.good{color:var(--good)} .pop.bad{color:var(--bad)} .pop.big{font-size:28px}
@keyframes rise{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -54px}}
.hm{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;animation:hm .25s ease-out forwards}
.hm i{position:absolute;left:50%;top:50%;width:9px;height:2px;background:#fff;box-shadow:0 0 8px var(--glow)}
.hm i:nth-child(1){transform:translate(-50%,-50%) rotate(45deg) translateX(-11px)}
.hm i:nth-child(2){transform:translate(-50%,-50%) rotate(135deg) translateX(-11px)}
.hm i:nth-child(3){transform:translate(-50%,-50%) rotate(225deg) translateX(-11px)}
.hm i:nth-child(4){transform:translate(-50%,-50%) rotate(315deg) translateX(-11px)}
@keyframes hm{0%{opacity:1;scale:.7}40%{opacity:1;scale:1.1}100%{opacity:0;scale:1.3}}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .tl{position:absolute;left:18px;top:14px;max-width:calc(46*var(--vw))}
#h-stat{font:700 22px/1.25 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#h-sub{font:500 12.5px/1.45 var(--mono);color:var(--muted);margin-top:2px}
#hud .btns{display:flex;gap:6px;margin-top:10px;pointer-events:auto}
.hb{cursor:pointer;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad)}
.hb:hover{border-color:var(--acc)}
#hud .tr{position:absolute;right:18px;top:12px;text-align:right}
/* 14/10/2026: nút về app ngay khi đang chơi (chỉ hiện trong app), nằm bên trái khối điểm */
#hud .tr .h-exit{position:absolute;right:calc(100% + 16px);top:3px;pointer-events:auto;display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,20,.74);color:#fff;font:600 13px/1 var(--body);letter-spacing:0;text-transform:none;white-space:nowrap;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
#hud .tr .h-exit[hidden]{display:none}
#hud .tr .h-exit svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
#hud .tr .h-exit:hover,#hud .tr .h-exit:focus-visible{background:#c42b1c;border-color:#ff8a7a;outline:none}
#h-score{font:700 34px/1.1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#h-combo{font:700 14px/1.3 var(--display);color:var(--acc2);min-height:18px;letter-spacing:.05em}
#h-xp{font:600 12px/1.4 var(--mono);color:var(--good)}
#h-extra{font:600 11.5px/1.5 var(--mono);color:var(--acc2);margin-top:4px;max-width:calc(34*var(--vw))}
#hud .bl{position:absolute;left:18px;bottom:16px}
#h-hpl{display:block;font:600 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#h-hp{display:flex;gap:4px}
#h-hp i{width:20px;height:8px;background:var(--acc);box-shadow:0 0 8px var(--glow);transform:skewX(-20deg);border-radius:calc(var(--rad)/3)}
#h-hp i.off{background:rgba(255,255,255,.12);box-shadow:none}
#h-hp.low i:not(.off){background:var(--bad);box-shadow:0 0 8px rgba(255,77,94,.7)}
#hud .br{position:absolute;right:18px;bottom:16px;font:500 12.5px/1.3 var(--mono);color:var(--muted)}
#hud .br b{color:var(--ink)}
#bossbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(520px,calc(60*var(--vw)));pointer-events:none}
#bossbar .bn{display:flex;justify-content:space-between;font:600 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bad);margin-bottom:5px}
#bossbar .bn small{color:var(--muted)}
#bossbar .bt{height:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,77,94,.35);border-radius:var(--rad);overflow:hidden}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--acc2));transition:width .25s}

/* ---- thanh chữ đang gõ ---- */
#tbar{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;pointer-events:none;padding:10px 16px 9px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(6px)}
#tbar .who{font:600 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
#tbar .wd{font:700 30px/1.36 var(--mono);white-space:pre;padding:2px 12px;border:1px solid var(--line);border-radius:var(--rad)}
#tbar .wd b{color:var(--acc);text-shadow:0 0 12px var(--glow)}
#tbar .wd u{text-decoration:none;background:var(--acc);color:var(--oncyc);padding:0 3px;border-radius:2px}
#tbar .wd i{font-style:normal;color:var(--ink);opacity:.85}
#tbar .keys{display:flex;gap:6px;justify-content:center}
#tbar .words{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;max-width:min(560px,calc(100vw - 40px))}
#tbar .words span{font:600 20px/1 var(--body);padding:7px 11px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:var(--rad)}
#tbar .words b{color:var(--acc);font-weight:800}
#tbar .keys span{font:700 18px/1 var(--mono);min-width:34px;padding:8px 9px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:var(--rad)}
#tbar .hint{margin-top:7px;font-size:12.5px;line-height:1.5;color:var(--muted)}
#tbar .hint .tk{color:var(--acc2)}
#tbar .hint .bad{color:var(--bad)}
#tbar.err{animation:shake .25s}
@keyframes shake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}

/* ---- banner / radio ---- */
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s}
#banner.show{opacity:1}
#banner h2{font:700 clamp(30px,calc(5*var(--vw)),58px)/1.18 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);text-shadow:0 0 30px var(--glow),0 3px 18px rgba(0,0,0,.7)}
#banner p{margin-top:8px;font:600 13px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc2);text-shadow:0 2px 10px #000}
#comm{position:fixed;left:18px;bottom:62px;width:min(420px,calc(100% - 36px));display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--rad);opacity:0;translate:-12px 0;transition:opacity .25s,translate .25s;pointer-events:none;backdrop-filter:blur(6px)}
#comm.show{opacity:1;translate:0 0}
#comm.warn{border-left-color:var(--bad)}
.av{width:46px;height:46px;flex:none;border-radius:calc(var(--rad) + 4px);overflow:hidden;background:rgba(255,255,255,.05)}
.av svg{width:100%;height:100%;display:block}
.nm{font:700 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.tx{font-size:14px;line-height:1.5;margin-top:3px}

/* ---- cutscene ---- */
#cine{position:fixed;inset:0;z-index:20}
#cine .bar{position:absolute;left:0;right:0;height:calc(11*var(--vh));background:#000}
#cine .bar.t{top:0} #cine .bar.b{bottom:0}
#cine .loc{position:absolute;left:28px;top:calc(11*var(--vh) + 18px);font:600 12px/1.4 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--acc);text-shadow:0 2px 8px #000}
#cine .dlg{position:absolute;left:50%;bottom:calc(11*var(--vh) + 22px);transform:translateX(-50%);width:min(760px,calc(100% - 32px));display:flex;gap:16px;padding:16px 18px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);cursor:pointer;backdrop-filter:blur(8px)}
#cine .av{width:64px;height:64px}
#cine .tx{font-size:16.5px;line-height:1.6;min-height:52px}
#cine .nx{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.skip{cursor:pointer;background:none;border:1px solid var(--line);padding:6px 10px;color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:var(--rad)}
.skip:hover{color:var(--ink);border-color:var(--acc)}

/* ---- menu ---- */
#menu{position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr;pointer-events:none}
#menu>*{pointer-events:auto}
.m-left{display:flex;flex-direction:column;gap:14px;padding:22px 18px 18px 24px;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.42) 70%,transparent);min-height:0}
.m-left h1{font:700 clamp(28px,calc(3*var(--vw)),40px)/1.12 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:6px;text-shadow:0 0 24px var(--glow)}
.m-left h1 em{font-style:normal;color:var(--acc)}
.m-tag{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:6px;max-width:330px}
.m-total{font:600 11.5px/1.4 var(--mono);color:var(--muted);margin-top:8px}
.lvlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.lv{cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 12px;background:rgba(10,14,22,.62);border:1px solid var(--line);border-radius:var(--rad)}
.lv:hover{border-color:var(--acc)}
.lv[aria-pressed="true"]{border-color:var(--acc);background:rgba(20,30,44,.86);box-shadow:inset 3px 0 0 var(--acc)}
.lv .no{font:700 19px/1 var(--display);color:var(--acc);text-align:center}
.lv .nm2{display:block;font:600 14.5px/1.3 var(--body)}
.lv .sub{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);margin-top:2px}
.lv.locked{opacity:.5}
.st{display:flex;gap:2px}
.st i{width:11px;height:11px;background:rgba(255,255,255,.15);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.st i.on{background:var(--acc2)}
.m-set{display:grid;gap:7px;padding-top:10px;border-top:1px solid var(--line)}
.m-set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.m-set .row>span{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:66px}
.chip{cursor:pointer;font:600 12.5px/1.2 var(--body);padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:var(--rad)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--oncyc);border-color:var(--acc)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.m-detail{position:absolute;right:24px;bottom:24px;width:min(500px,calc(100% - 48px));padding:22px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(10px)}
.m-detail h2{font:700 clamp(26px,calc(3*var(--vw)),38px)/1.15 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:6px}
.m-detail .desc{margin-top:10px;font-size:14.5px;line-height:1.6;color:#d4deee}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font:600 11.5px/1.3 var(--mono);padding:5px 8px;border:1px solid var(--line);color:var(--muted);border-radius:var(--rad)}
.meta span.a{color:var(--acc2);border-color:rgba(255,181,71,.4)}
.meta span.g{color:var(--good);border-color:rgba(109,255,158,.35)}
.go{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{cursor:pointer;font:700 15px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--acc);background:var(--acc);color:var(--oncyc);border-radius:var(--rad)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.lnk{cursor:pointer;background:none;border:0;color:var(--acc);font:500 13px/1.4 var(--body);text-decoration:underline;text-underline-offset:3px}
.fine{margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--muted)}
kbd{font:600 11px/1 var(--mono);padding:2px 5px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.06)}
#loadmsg{font:500 12.5px/1.4 var(--mono);color:var(--muted)}

/* ---- bảng kết quả ---- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(2,4,8,.55);z-index:25}
.panel{width:min(600px,100%);max-height:calc(100*var(--vh) - 24px);overflow-y:auto;background:var(--glass);border:1px solid var(--line);padding:26px;border-radius:var(--rad);backdrop-filter:blur(10px)}
.panel h1{margin-top:10px;font:700 clamp(30px,calc(4.4*var(--vw)),50px)/1.14 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);text-shadow:0 0 26px var(--glow)}
.stars{display:flex;gap:8px;margin-top:14px}
.stars i{width:34px;height:34px;background:rgba(255,255,255,.12);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--acc2);filter:drop-shadow(0 0 10px var(--acc2))}
.xpbox{margin-top:14px;padding:10px 12px;border:1px solid rgba(109,255,158,.35);font-size:14px;line-height:1.55;border-radius:var(--rad)}
.xpbox b{color:var(--good)}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{border:1px solid var(--line);padding:9px 10px;border-radius:var(--rad)}
.stats span{display:block;font:600 10px/1.3 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stats b{display:block;margin-top:4px;font:700 21px/1.2 var(--display);font-variant-numeric:tabular-nums}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font:600 13px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);z-index:40}

@media (max-width:639px){
  #menu{grid-template-columns:1fr}
  .m-left{background:rgba(0,0,0,.6)}
  .lvlist{max-height:calc(34*var(--vh))}
  .m-detail{position:relative;right:auto;bottom:auto;margin:0 16px 16px;width:auto}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tbar{bottom:96px} #tbar .wd{font-size:22px}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

#imewarn{position:fixed;left:50%;top:72px;transform:translate(-50%,-8px);z-index:60;max-width:min(620px,calc(100% - 32px));padding:12px 16px;border-radius:10px;background:#2b1406;border:1px solid #ffb547;color:#ffe6c2;font:500 14px/1.5 system-ui,'Segoe UI',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#imewarn.show{opacity:1;transform:translate(-50%,0)}
#imewarn b{color:#ffcf7a}

/* Nút về app: góc phải trên như nút đóng quen thuộc */
.m-exit{position:absolute;top:16px;right:18px;z-index:5;pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:9px 15px 9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,20,.74);color:#fff;font:600 14px/1 var(--body);letter-spacing:0;text-transform:none;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
.m-exit[hidden]{display:none}
.m-exit svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.m-exit:hover,.m-exit:focus-visible{background:#c42b1c;border-color:#ff8a7a;outline:none}
body.g-orbit.in-app .m-set{top:66px}
body.g-orbit.in-app .m-detail{top:176px}

.xpbox .xpn{display:block;margin-top:3px;font-size:.92em;opacity:.82}

<script>
(()=>{"use strict";
/* ================= Vietnamese Telex engine (built-in, no Unikey needed) ================= */
const VI_TONE_CM={'́':'s','̀':'f','̉':'r','̃':'x','̣':'j'};
const VI_TONE_MARK={s:'́',f:'̀',r:'̉',x:'̃',j:'̣'};
const VI_MARK_CM={'̂':'^','̆':'(','̛':'+'};
const VI_MARK_CH={'^':'̂','(':'̆','+':'̛'};
const VI_TONE_NAME={s:'dấu sắc',f:'dấu huyền',r:'dấu hỏi',x:'dấu ngã',j:'dấu nặng'};
function viBase(c){ if(c==='đ'||c==='Đ') return 'd'; const d=c.normalize('NFD'); return d[0].toLowerCase(); }
function viCharInfo(c){ const lc=c.toLowerCase(); if(lc==='đ') return {b:'d',m:'-',t:''}; const d=lc.normalize('NFD'); let m='',t=''; for(const cm of d.slice(1)){ if(VI_MARK_CM[cm]) m=VI_MARK_CM[cm]; else if(VI_TONE_CM[cm]) t=VI_TONE_CM[cm]; } return {b:d[0],m,t}; }
function viInfo(str){ let tone=''; const chars=[...str.normalize('NFC')].map(c=>{ const i=viCharInfo(c); if(i.t) tone=i.t; return i; }); return {chars,tone}; }
const isVowelB=b=>'aeiouy'.includes(b);
function telexParse(raw){
  const L=[]; let tone=''; let lit=false;
  for(const k0 of raw){
    if(k0==='`'){ lit=true; continue; }
    if(lit){ lit=false; const i=viCharInfo(k0); L.push({b:i.b,m:i.m}); if(i.t) tone=i.t; continue; }
    // dấu tổ hợp rời (Unikey bảng mã Unicode tổ hợp): gắn vào chữ trước
    if(/[\u0300-\u036f]/.test(k0)){ if(VI_TONE_CM[k0]){ if(L.some(x=>isVowelB(x.b))) tone=VI_TONE_CM[k0]; } else if(VI_MARK_CM[k0]&&L.length) L[L.length-1].m=VI_MARK_CM[k0]; continue; }
    if(/[^\x00-\x7f]/.test(k0)){ const i=viCharInfo(k0); L.push({b:i.b,m:i.m}); if(i.t) tone=i.t; continue; }
    const k=k0.toLowerCase(); const hasV=L.some(x=>isVowelB(x.b));
    if(k==='a'||k==='e'||k==='o'){ let i=-1, seenV=false; for(let j=L.length-1;j>=0;j--){ if(isVowelB(L[j].b)){ seenV=true; if(L[j].b===k&&!L[j].m){ i=j; break; } } else if(seenV) break; } if(i>=0){ L[i].m='^'; continue; } }
    if(k==='w'){
      const iu=L.findIndex((x,i)=>x.b==='u'&&x.m!=='^'&&L[i+1]&&L[i+1].b==='o'&&L[i+1].m!=='^');
      if(iu>=0&&!(L[iu].m==='+'&&L[iu+1].m==='+')){ L[iu].m='+'; L[iu+1].m='+'; continue; }
      // w áp vào nguyên âm a/o/u CUỐI chưa có dấu mũ/móc (hoaw → hoă, quaw → quă, ow → ơ, uw → ư; huuw → hưu; muaw → mưa)
      let i=-1; for(let j=L.length-1;j>=0;j--){ if('aou'.includes(L[j].b)&&!L[j].m){ i=j; break; } } if(i>0&&L[i].b==='u'&&L[i-1].b==='u'&&!L[i-1].m) i--;
      // ua + w: không có q đứng trước thì móc vào u (muaw → mưa, cuawr → cửa); có q thì trăng vào a (quaw → quă)
      if(i>0&&L[i].b==='a'&&L[i-1].b==='u'&&!L[i-1].m&&!(i>=2&&L[i-2].b==='q')) i--;
      if(i>=0){ L[i].m=L[i].b==='a'?'(':'+'; continue; }
      if(!hasV){ L.push({b:'u',m:'+'}); continue; }
    }
    if(k==='d'&&L.length>=1&&L[0].b==='d'&&!L[0].m&&(L.length===1||hasV)){ L[0].m='-'; continue; }
    if('sfrxj'.includes(k)&&hasV){ tone=k; continue; }
    if(k==='z'&&hasV){ tone=''; continue; }
    L.push({b:k,m:''});
  }
  return {L,tone};
}
function viTonePos(chars){
  const info=chars.map(viCharInfo); let vs=[]; for(let i=0;i<info.length;i++) if(isVowelB(info[i].b)) vs.push(i);
  if(vs.length>1&&info[0].b==='q'&&vs[0]===1) vs.shift();
  if(vs.length>1&&info[0].b==='g'&&info[1]&&info[1].b==='i'&&vs[0]===1) vs.shift();
  if(!vs.length) return -1;
  const marked=vs.filter(i=>info[i].m&&info[i].m!=='-'); if(marked.length) return marked[marked.length-1];
  if(vs.length===1) return vs[0];
  if(vs[vs.length-1]<chars.length-1) return vs[vs.length-1];
  if(vs.length>=3) return vs[1];
  const pair=info[vs[0]].b+info[vs[1]].b; if(pair==='oa'||pair==='oe'||pair==='uy') return vs[1]; return vs[0];
}
function telexCompose(raw){
  const {L,tone}=telexParse(raw);
  const chars=L.map(x=>x.m==='-'?'đ':(x.b+(VI_MARK_CH[x.m]||'')).normalize('NFC'));
  if(tone){ const i=viTonePos(chars); if(i>=0) chars[i]=(chars[i].normalize('NFD')+VI_TONE_MARK[tone]).normalize('NFC'); }
  return chars.join('');
}
function viCompat(comp,target){ const a=viInfo(comp), t=viInfo(target); if(a.chars.length>t.chars.length) return false;
  for(let i=0;i<a.chars.length;i++){ const x=a.chars[i], y=t.chars[i]; if(x.b!==y.b) return false; if(x.m&&x.m!==y.m) return false; }
  if(a.tone&&a.tone!==t.tone) return false; return true; }
function viEq(comp,target){ const a=viInfo(comp), t=viInfo(target); if(a.chars.length!==t.chars.length||a.tone!==t.tone) return false; return a.chars.every((x,i)=>x.b===t.chars[i].b&&x.m===t.chars[i].m); }
/* Telex chuẩn (khoá gõ tối thiểu) của 1 âm tiết: "viện" → "vieenj", "đường" → "dduowngf" */
function viTelexKeys(syl){ const {chars,tone}=viInfo(syl); let out='';
  for(let i=0;i<chars.length;i++){ const c=chars[i]; if(c.m==='-'){ out+='dd'; continue; } out+=c.b;
    if(c.m==='^') out+=c.b; else if(c.m==='('||c.m==='+'){ if(c.b==='u'&&chars[i+1]&&chars[i+1].b==='o'&&chars[i+1].m==='+'){ out+='o'; i++; } out+='w'; } }
  return out+(tone||''); }
function viDiff(a,b){ const x=[...a.normalize('NFC').toLowerCase()], y=[...b.normalize('NFC').toLowerCase()]; let n=Math.abs(x.length-y.length); for(let i=0;i<Math.min(x.length,y.length);i++) if(x[i]!==y[i]) n++; return Math.max(1,n); }
function viSyl(st,word){ const done=st.done||0; const sp=word.indexOf(' ',done); const end=sp<0?word.length:sp; return {done,sp,end,target:word.slice(done,end),raw:st.raw||'',comp:st.comp||''}; }
/* 12/10/2026 — gõ tự do kiểu Telex như bộ gõ thật, bấm Space mới chấm cả âm tiết (giống màn gõ tiểu thuyết):
   thứ tự phím tuỳ ý (vieejn, vieenj… đều đúng), chỉ so kết quả. state: {done, raw, comp}.
   Trả về: phím thường → {ok,pend}; Space đúng → {ok,n (ký tự được tính),done}; Space sai → {ok:false,syl:true,n,got,want}. */
function viStep(st,word,ch,apply,locked){
  const S=viSyl(st,word); if(S.done>=word.length) return {ok:false};
  if(ch===' '){ if(!S.raw) return {ok:false,empty:true}; const comp=telexCompose(S.raw);
    if(viEq(comp,S.target)){ const n=[...S.target.normalize('NFC')].length+(S.sp>=0?1:0); if(apply){ st.done=S.sp<0?word.length:S.end+1; st.raw=''; st.comp=''; } return {ok:true,done:S.sp<0,n}; }
    const n=viDiff(comp,S.target); if(apply){ st.raw=''; st.comp=''; } return {ok:false,syl:true,n,got:comp,want:S.target}; }
  // chữ cái đầu chỉ dùng để CHỌN mục tiêu; đã khoá mục tiêu thì cứ nhận phím, bấm Space mới chấm (không trừ dồn từng phím)
  if(!locked&&!S.raw&&S.done===0&&!viCompat(telexCompose(ch),S.target)) return {ok:false};
  if(S.raw.length>=S.target.length*3+6) return {ok:false};
  const nraw=S.raw+ch; if(apply){ st.raw=nraw; st.comp=telexCompose(nraw); } return {ok:true,pend:true,done:false};
}
function viBack(st){ if(!st.raw) return; let r=st.raw.slice(0,-1); if(r.endsWith('`')) r=r.slice(0,-1); st.raw=r; st.comp=telexCompose(r); }
/* gợi ý: key = phím kế theo Telex chuẩn (dùng cho test tự động / chữ cái đầu), keys = cả chuỗi Telex của âm tiết */
function viHint(st,word){
  const S=viSyl(st,word); if(S.done>=word.length) return {key:'',label:'',keys:''};
  const keys=viTelexKeys(S.target); const comp=telexCompose(S.raw);
  const last=S.sp<0, multi=word.indexOf(' ')>=0;
  if(S.raw&&viEq(comp,S.target)) return {key:' ',label:'dấu cách',keys,ready:true,last,multi};
  const r=S.raw.toLowerCase(); if(keys.startsWith(r)){ const k=keys[r.length]; return {key:k,label:k,keys,last,multi}; }
  return {key:' ',label:'',keys,off:!viCompat(comp,S.target),last,multi};
}
/* 13/10/2026 — dòng nhắc dưới thanh gõ. Dấu cách cuối câu không nhìn thấy nên nói rõ: chữ cuối cũng phải bấm Space mới xong. */
function viHintHtml(h,E,verb){ const K='<kbd>Space</kbd>', tk='<span class="tk">'+E(h.keys||'')+'</span>';
  if(h.ready) return h.last?'<b class="vgo">Gõ xong rồi, bấm '+K+' để '+verb+'</b>':'Đủ chữ rồi, bấm '+K+' sang chữ tiếp';
  if(h.last&&h.multi) return 'Chữ cuối: '+tk+' rồi bấm '+K+' để '+verb;
  return 'Telex: '+tk+' rồi '+K+(h.last?' để '+verb:''); }

/* 13/10/2026 — CHỮ MẪU luôn giữ nguyên (không bị chữ người gõ đè lên).
   Mẫu: phần đã xong tô màu, âm tiết đang gõ gạch chân (khớp → tô dần theo mẫu; lệch → gạch đỏ).
   Chữ người đang gõ hiện RIÊNG ở ô "Bạn đang gõ" (viInputHtml) dưới mẫu. */
function viSampleHtml(st,word,E,on){ const S=viSyl(st,word); if(S.done>=word.length) return '<b>'+E(word)+'</b>';
  const tg=[...S.target], comp=S.raw?telexCompose(S.raw):'', ok=!S.raw||viCompat(comp,S.target), n=ok?Math.min(tg.length,[...comp].length):0;
  const cur=on?'<span class="cur'+(ok?'':' bad')+'">'+(n?'<b>'+E(tg.slice(0,n).join(''))+'</b>':'')+E(tg.slice(n).join(''))+'</span>':E(S.target);
  // chữ cuối: thêm phím "Space" nhìn thấy được ở cuối mẫu (đủ chữ thì nhấp nháy)
  const end=on&&S.sp<0?'<kbd class="vend'+(S.raw&&viEq(comp,S.target)?' go':'')+'">Space</kbd>':'';
  return (S.done?'<b>'+E(word.slice(0,S.done))+'</b>':'')+cur+E(word.slice(S.end))+end; }
function viInputHtml(st,word,E){ const S=viSyl(st,word); if(!S.raw||S.done>=word.length) return ''; const comp=telexCompose(S.raw), ok=viCompat(comp,S.target);
  return '<div class="vin'+(ok?'':' bad')+'"><span>'+(ok?'Bạn đang gõ':'Bạn gõ lệch')+'</span><b>'+E(comp)+'</b><em>phím: '+E(S.raw)+'</em>'+(ok?'':'<span>mẫu: <i>'+E(S.target)+'</i></span>')+'</div>'; }

/* =====================================================================
   Chọn mức đồ hoạ — dùng chung 6 game (13/10/2026)
   Lưu ở localStorage 'tg_gfx' = auto | high | low. Các trang game cùng origin nên chọn 1 lần là áp cho mọi game.
   - Lần đầu vào: hộp chọn hiện giữa màn, có đề xuất theo card đồ hoạ của máy.
   - Máy yếu mà chọn Cao: cảnh báo, hỏi lại.
   - Sau đó đổi lại ở chip "Đồ hoạ" trong menu hoặc nút "Đồ hoạ" góc trên khi đang chơi.
   - Tự động: game đo độ mượt, tự hạ/nâng phát sáng và độ nét 3D. Cao/Nhẹ: giữ cố định.
   Engine (kit.js / core.js) cần có: GPU_WEAK, GPU_NAME, WEBGL2, store, esc, và gọi gfxBoot({apply, hold, zoom}).
   ===================================================================== */
const GFX_MODES=['auto','high','low'];
const GFX={mode:'auto',open:false,first:false,lagHinted:false,hooks:{}};
function gfxStoredMode(){ const m=store('tg_gfx'); return GFX_MODES.includes(m)?m:null; }
function gfxRec(){ return (!WEBGL2||GPU_WEAK)?'low':'high'; }
function gfxEff(mode){ return !WEBGL2?'low':(mode==='auto'?gfxRec():mode); }
const GFX_NAME={auto:'Tự động',high:'Cao',low:'Nhẹ'};
function gfxBoot(hooks){ GFX.hooks=hooks||{}; const m=gfxStoredMode(); GFX.first=!m; GFX.mode=m||'auto'; gfxCss(); gfxSync();
  addEventListener('keydown',gfxKey,true); }
/* chip/nút trên giao diện: [data-gfx="auto|high|low"] và [data-gfx-open] */
function gfxSync(){ document.querySelectorAll('[data-gfx]').forEach(b=>{ b.setAttribute('aria-pressed',String(b.dataset.gfx===GFX.mode)); if(!WEBGL2&&b.dataset.gfx==='high') b.disabled=true;
    if(!b._gfx){ b._gfx=1; b.addEventListener('click',e=>{ e.currentTarget.blur(); gfxPick(b.dataset.gfx,false); }); } });
  document.querySelectorAll('[data-gfx-open]').forEach(b=>{ b.textContent='Đồ hoạ: '+GFX_NAME[GFX.mode]; if(!b._gfx){ b._gfx=1; b.addEventListener('click',e=>{ e.currentTarget.blur(); gfxOpen(false); }); } }); }
function gfxSet(mode){ if(!GFX_MODES.includes(mode)) return; GFX.mode=mode; store('tg_gfx',mode); GFX.lagHinted=false; const n=document.getElementById('perfnote'); if(n) n.classList.remove('show');
  if(GFX.hooks.apply) GFX.hooks.apply(gfxEff(mode),mode); gfxSync(); }
/* chọn từ chip hoặc hộp: máy yếu chọn Cao → hỏi lại */
function gfxPick(mode,fromDlg){ if(mode==='high'&&WEBGL2&&GPU_WEAK&&GFX.mode!=='high'){ gfxOpen(!!GFX.first,'warn'); return; } gfxSet(mode); if(fromDlg) gfxClose(); }
function gfxVerdict(){ const g=GPU_NAME?'<b>'+esc(GPU_NAME)+'</b>':'<b>không rõ tên</b>';
  if(!WEBGL2) return 'Trình duyệt của máy không hỗ trợ WebGL 2, game chỉ chạy được đồ hoạ <b>Nhẹ</b>.';
  return GPU_WEAK?'Card đồ hoạ của máy: '+g+'. Đây là card tích hợp đời cũ, nên chơi <b>Tự động</b> hoặc <b>Nhẹ</b> để mượt.'
    :'Card đồ hoạ của máy: '+g+'. Máy đủ khoẻ để chơi <b>Cao</b>; chọn <b>Tự động</b> để game tự chỉnh khi cần.'; }
function gfxOpen(first,view){ let d=document.getElementById('gfxdlg'); if(!d){ d=document.createElement('div'); d.id='gfxdlg'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-labelledby','gfx-h'); document.body.appendChild(d); }
  GFX.first=!!first; const rec=gfxRec();
  if(view==='warn'){
    d.innerHTML=`<div class="gx-box warn"><h2 id="gfx-h">Máy bạn có thể không chạy mượt đồ hoạ Cao</h2>
      <p>Card đồ hoạ <b>${esc(GPU_NAME||'của máy')}</b> là card tích hợp đời cũ. Ở mức Cao, game dễ bị giật và gõ phím có thể bị trễ.</p>
      <p>Nên dùng <b>Tự động</b>: game tự hạ độ nét khi giật và nâng lại khi máy rảnh.</p>
      <div class="gx-act"><button type="button" class="gx-btn pri" data-gx="auto">Dùng Tự động</button><button type="button" class="gx-btn" data-gx="force-high">Vẫn chọn Cao</button><button type="button" class="gx-btn ghost" data-gx="back">Quay lại</button></div></div>`;
  } else {
    const card=(m,desc,tag)=>`<button type="button" class="gx-opt${GFX.mode===m&&!first?' cur':''}${m==='auto'?' rec':''}" data-gx="${m}" ${(!WEBGL2&&m==='high')?'disabled':''}>
      <span class="gx-k">${m==='auto'?1:m==='high'?2:3}</span><span class="gx-n">${GFX_NAME[m]}${m==='auto'?' <em>Đề xuất</em>':''}${tag?' <i>'+tag+'</i>':''}</span><span class="gx-d">${desc}</span>${GFX.mode===m&&!first?'<span class="gx-cur">Đang dùng</span>':''}</button>`;
    d.innerHTML=`<div class="gx-box"><span class="gx-eye">${first?'Lần đầu vào Khu Game':(GFX.hooks.playing&&GFX.hooks.playing()?'Cài đặt đồ hoạ · game đang tạm dừng':'Cài đặt đồ hoạ')}</span><h2 id="gfx-h">Chọn mức đồ hoạ</h2>
      <p class="gx-v">${gfxVerdict()}</p>
      <div class="gx-opts">${card('auto','Game đo độ mượt khi chơi, tự giảm phát sáng và độ nét lúc máy giật, tự nâng lại khi máy rảnh.','')}
        ${card('high','Hình đẹp nhất: phát sáng, khử răng cưa, đổ bóng, độ nét đầy đủ. Hợp máy có card rời.',rec==='high'?'Hợp máy bạn':(WEBGL2?'Có thể giật':''))}

/* ---------------- tiện ích ---------------- */
function anims(gltf,root){ const mix=new THREE.AnimationMixer(root), A={}; gltf.animations.forEach(c=>A[c.name]=mix.clipAction(c)); return {mix,A,cur:null}; }
function playAnim(o,name,fade,once,ts){ if(!o) return; const a=o.A[name]; if(!a) return; if(o.cur===a&&!once) return; a.reset(); a.setEffectiveTimeScale(ts||1); a.setEffectiveWeight(1); if(once){ a.setLoop(THREE.LoopOnce,1); a.clampWhenFinished=true; } else a.setLoop(THREE.LoopRepeat,Infinity);
  if(o.cur&&o.cur!==a) a.crossFadeFrom(o.cur,fade||.2,false); a.play(); o.cur=a; }
function stdM(c,o){ return new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(c).convertSRGBToLinear(),roughness:.9,flatShading:true},o||{})); }
function lumpy(g,amt,seed){ const p=g.attributes.position; for(let k=0;k<p.count;k++){ const f=1+(vnoise(p.getX(k)*1.3+seed,p.getY(k)*1.3,p.getZ(k)*1.3+seed)-.5)*amt; p.setXYZ(k,p.getX(k)*f,p.getY(k)*f,p.getZ(k)*f); } g.computeVertexNormals(); return g; }
function noiseTex(w,h,base,fn,rx,ry){ return tex(cv(w,h,(x,W,H)=>{ const img=x.createImageData(W,H),d=img.data; for(let j=0;j<H;j++) for(let i=0;i<W;i++){ const c=fn(i/W,j/H); const k=(j*W+i)*4; d[k]=c[0]; d[k+1]=c[1]; d[k+2]=c[2]; d[k+3]=255; } x.putImageData(img,0,0); if(base) base(x,W,H); }),rx,ry,true); }

function buildRunner(){
  scene.background=new THREE.Color(0x9fd8c8); scene.fog=new THREE.Fog(0x9fd8c8,30,150);
  RN.hemi=new THREE.HemisphereLight(0xdff6ff,0x3a5a2a,.9); scene.add(RN.hemi);
  const sun=new THREE.DirectionalLight(0xfff0d0,2.2); sun.position.set(-14,26,8); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-18; sc.right=18; sc.top=22; sc.bottom=-22; sc.near=1; sc.far=80; sun.shadow.bias=-.0006; sun.shadow.normalBias=.03; sun.target.position.set(0,0,-8); scene.add(sun); scene.add(sun.target); RN.sun=sun;
  RN.amb=new THREE.AmbientLight(0xffffff,.15); scene.add(RN.amb);
  // bầu trời gradient
  RN.skyU={top:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunC:{value:new THREE.Color()},sunD:{value:new V3(-.3,.25,-1).normalize()}};
  const sky=new THREE.Mesh(new THREE.SphereGeometry(400,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:RN.skyU,
    vertexShader:'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader:'uniform vec3 top,hor,sunC,sunD; varying vec3 vP; void main(){ float h=clamp(vP.y,0.,1.); vec3 c=mix(hor,top,pow(h,.55)); float s=max(dot(vP,sunD),0.); c+=sunC*(pow(s,600.)*6.+pow(s,10.)*.35); gl_FragColor=vec4(c,1.); }'}));
  scene.add(sky); RN.sky=sky;
  // Rô-bô Tí
  const rg=new THREE.Group(); scene.add(rg); RN.roboG=rg; const rb=new THREE.Group(); rg.add(rb); RN.roboBody=rb;
  const m=RN.models.RobotExpressive.scene; m.rotation.y=Math.PI; rb.add(m); fitHeight(m,1.9); m.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; if(o.material&&o.material.color&&o.material.name==='Main') o.material.color.set(0xffc93a).convertSRGBToLinear(); } });
  RN.robo=anims(RN.models.RobotExpressive,m); playAnim(RN.robo,'Idle');
  const lamp=new THREE.SpotLight(0xd8f4ff,0,26,.42,.5,1.2); lamp.position.set(0,1.75,-.2); lamp.target.position.set(0,0,-12); rg.add(lamp); rg.add(lamp.target); RN.lamp=lamp;
  const lg=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:C(2.4,2.8,3),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0})); lg.position.set(0,1.72,-.32); lg.scale.setScalar(.5); rg.add(lg); RN.lampG=lg;
  // Khủng Long Đá
  const dg=new THREE.Group(); scene.add(dg); RN.dinoG=dg; const d=RN.models.big_dino.scene; dg.add(d); fitHeight(d,4.6);
  d.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; if(o.material){ const n=o.material.name; o.material=o.material.clone(); o.material.flatShading=false; if(n==='Dino_Main'){ o.material.color.setRGB(.13,.11,.095); o.material.roughness=1; o.material.metalness=0; } else if(n==='Dino_Secondary'){ o.material.color.setRGB(.3,.08,.01); o.material.emissive=new THREE.Color(1.6,.45,.06); } else if(n==='Eye_White'){ o.material.emissive=new THREE.Color(3,.5,.1); } else if(n==='Dino_Tongue'){ o.material.emissive=new THREE.Color(.6,.1,.05); } } } });
  RN.dino=anims(RN.models.big_dino,d); playAnim(RN.dino,'sprint'); dg.visible=false;
  const eye=new THREE.PointLight(0xff5a2a,0,6,2); eye.position.set(0,3.6,-1.4); dg.add(eye); RN.dinoEye=eye;
  // đường chạy + nền (vật liệu đổi theo vùng)
  RN.pathM=new THREE.MeshStandardMaterial({roughness:.95}); const path=new THREE.Mesh(new THREE.PlaneGeometry(3.6,240),RN.pathM); path.rotation.x=-Math.PI/2; path.position.set(0,.02,-100); path.receiveShadow=true; scene.add(path); RN.path=path;
  RN.sideM=new THREE.MeshStandardMaterial({roughness:1}); const side=new THREE.Mesh(new THREE.PlaneGeometry(240,240),RN.sideM); side.rotation.x=-Math.PI/2; side.position.set(0,0,-100); side.receiveShadow=true; scene.add(side); RN.side=side;
  // hạt bay (đom đóm / bụi tro / phấn hoa)
  const n=300,pos=new Float32Array(n*3); for(let i=0;i<n;i++){ pos[i*3]=rand(-24,24); pos[i*3+1]=rand(.3,9); pos[i*3+2]=rand(-90,10); } const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  RN.motes=new THREE.Points(pg,new THREE.PointsMaterial({size:.14,map:glowTex(true),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:0xffffff})); scene.add(RN.motes);
  RN.built=true; setBiome(NLV[K.li||0].biome);
  camera.position.set(4.6,3.1,6.6); camera.lookAt(-.8,1.3,-6);
}

  O.tg=addTarget({word:pickWord(Array.isArray(lv.tier)?pick(lv.tier):lv.tier),anchor:O.anchor,center:O.center,rad:1.2,label:ALBL[O.act],kind:O.act==='long'?'gold':'',danger:()=>O.g.position.z,rt:O}); return O; }
function spawnGem(){ const g=gemMesh(); const s=Math.random()<.5?-1:1; g.position.set(s*1.25,1.6,-62); scene.add(g);
  const O={g,kind:'gem',act:'gem',h:.4,cleared:false,done:false,anchor:new V3(),center:new V3(),side:s}; RN.obs.push(O);
  O.tg=addTarget({word:pickWord('short'),anchor:O.anchor,center:O.center,rad:.6,label:'Ngọc · bứt tốc',kind:'gold',danger:()=>O.g.position.z-14,rt:O}); return O; }
function spawnPush(){ const g=new THREE.Group(); const st=stdM(RN.biome==='volcano'?0x5a4038:0x6a6460); const p=mesh(g,new THREE.CylinderGeometry(.8,.9,9,10),st,0,4.5,0,true); mesh(g,new THREE.BoxGeometry(2.2,.6,2.2),st,0,.3,0,true); g.position.set(-3.4,0,1.2); scene.add(g);
  const O={g,kind:'push',act:'push',h:5,cleared:false,done:false,anchor:new V3(-2.4,4.2,0),center:new V3(-2.4,3,0),t:0,limit:0,pillar:p}; RN.obs.push(O); RN.pushO=O;
  const w=pickWord('long'); O.limit=Math.max(4.5,[...w].length*.55+2.4); O.tg=addTarget({word:w,anchor:O.anchor,center:O.center,rad:1,label:'Đẩy cột!',kind:'boss',big:true,danger:()=>99,rt:O});
  RN.gap=Math.min(RN.gap,12); RN.charge=1; banner('ĐẨY CỘT!','Gõ thật nhanh trước khi nó vồ tới',1800); say('lan','Nó lao tới! Gõ dòng chữ lớn để xô cột đá chặn đường!',true); roar(); return O; }
function killObs(O){ O.done=true; if(O.tg){ removeTarget(O.tg); O.tg=null; } scene.remove(O.g); O.g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); o.material&&(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose()); }); const i=RN.obs.indexOf(O); if(i>=0) RN.obs.splice(i,1); if(RN.pushO===O) RN.pushO=null; }
function clearRun(){ for(const O of RN.obs.slice()) killObs(O); RN.obs=[]; RN.act=null; RN.pushO=null; }

/* ---------------- gõ trúng ---------------- */
function hitObstacle(t,done){ const O=t.rt; if(!O) return; SFX.tone(700+t.typed*40,.04,'triangle',.035);
  if(!done) return; O.cleared=true; O.tg=null; removeTarget(t); const p=O.center.clone(); K.score+=Math.round(([...t.word].length*30)*(1+Math.min(2,K.combo/20)));
  if(O.kind==='gem'){ RN.gems++; K.extra.gems=RN.gems; RN.boost=2.2; RN.gap=Math.min(40,RN.gap+5); sparks(p,40,5,C(.6,3,1.6),.4); ring(p,new V3().subVectors(camera.position,p),1.4,C(.8,3,1.6),.45); SFX.power(); pop(p,'Bứt tốc!','good'); RN.gemFly=O; O.fly=0; O.from=O.g.position.clone(); drawGems(); return; }
  if(O.kind==='push'){ O.fall=0.001; RN.gap=Math.min(40,RN.gap+14); RN.charge=0; K.score+=1500; pop(p,'CHẶN ĐƯỢC!','good'); SFX.noise(.8,.7,'lowpass',900,120,.7); SFX.tone(70,.8,'sine',.5,30); say('ti',pick(['Ăn cột đá đi!','Chặn được rồi!','Ha, đứng yên đó!'])); return; }
  sparks(p,18,3,C(1.2,2.6,1),.6); ring(p,new V3(0,1,0),1.2,C(.8,2.4,1),.35); pop(p,ALBL[O.act]+'!','');
  if(O.glow) O.glow.color.set(0x6aff9a); O.g.traverse(o=>{ if(o.isMesh&&o.material&&o.material.emissive&&!o.material.map){ o.material=o.material.clone(); o.material.emissive.set(0x1a6a2a); o.material.emissiveIntensity=.6; } }); }
function drawGems(){ const e=$('#n-gemc'); if(e) e.textContent=RN.gems; const g=$('#n-gems'); if(g){ g.classList.remove('pulse'); void g.offsetWidth; g.classList.add('pulse'); } }
function roar(){ SFX.noise(1.1,.6,'lowpass',700,140,1.2); SFX.tone(90,1,'sawtooth',.12,50); SFX.tone(60,1.2,'sine',.3,35); K.shake=Math.max(K.shake,.6); }

/* ---------------- động tác của Tí ---------------- */
function doAct(kind){ const dur=kind==='long'?1:kind==='slide'?.8:.72; RN.act={kind,t:0,dur}; if(kind!=='slide') playAnim(RN.robo,'Jump',.08,true,kind==='long'?1.25:1.55); else { sparks(new V3(0,.1,.4),14,2,C(.8,.7,.5),.4,{floor:0}); SFX.noise(.5,.3,'bandpass',1200,400,1); } SFX.tone(kind==='slide'?300:420,.15,'triangle',.06,kind==='slide'?160:780); }
function stumble(O){ RN.stumbles++; K.extra.stumbles=RN.stumbles; K.combo=0; RN.gap-=8; RN.slow=1.1; K.shake=Math.max(K.shake,.9); K.hurtFx=1; screenFlash(.15,300);
  const p=O.g.position.clone().add(new V3(0,.6,0)); if(O.act==='long'){ sparks(p,20,3,C(1,.6,.3),.5); } else explosion(p,{size:.8,color:C(1.6,1.1,.6),floor:0}); SFX.noise(.35,.7,'lowpass',1400,200,.7); SFX.tone(160,.25,'square',.06,70);
  RN.act={kind:'trip',t:0,dur:.55}; say(pick(['ti','lan']),pick(['Ối! Vấp rồi!','Cẩn thận Tí ơi!','Nó áp sát kìa!','Gõ nhanh lên em!']),true); }

/* ---------------- vòng chạy ---------------- */
function resetRun(lv,pre){ clearRun(); RN.dist=0; RN.gap=10; RN.speed=lv.speed[0]; RN.boost=0; RN.slow=0; RN.gems=0; RN.stumbles=0; RN.nextAt=30; RN.pushes=(lv.push||[]).slice(); RN.gateO=null; RN.finish=false; RN.charge=0; RN.caught=false;
  RN.roboG.position.set(0,0,0); RN.roboBody.rotation.set(0,0,0); RN.roboBody.position.set(0,0,0); RN.dinoG.visible=true; RN.dinoG.position.set(0,0,9); RN.dinoG.rotation.set(0,0,0); playAnim(RN.dino,'sprint',.2); }
function startRun(li,lv){ resetRun(lv); K.extra={gems:0,stumbles:0}; $('#n-goal').textContent='/ '+lv.goal+' m'; drawGems(); playAnim(RN.robo,'Running',.25); RN.mus=true; RN.mt=SFX.ctx?SFX.ctx.currentTime+.1:0; RN.ms=0; RN.bpm=118+li*6;
  status(lv.name,'Chạy tới '+lv.goal+' m'); roar(); banner('CHẠY!','Khủng long đang đuổi theo',1500); say('lan',li===0?'Gõ chữ trên khúc gỗ đầu tiên! Nhanh lên!':'Chạy tiếp đi Tí, nó vẫn bám theo!'); }
function runUpdate(dt,mode){ if(!RN.built) return; const t=K.clock;
  RN.robo.mix.update(dt); RN.dino.mix.update(dt);
  const play=mode==='play'&&!K.over;
  // vật trang trí trôi
  const vel=play?(RN.curV||0):0;
  for(const it of RN.items){ it.o.position.z+=vel*dt; if(it.o.position.z>20){ it.o.position.z-=SPAN; if(!it.opt.grid){ const s=Math.random()<.5?-1:1; it.o.position.x=it.opt.center?rand(-it.xr[1],it.xr[1]):s*rand(it.xr[0],it.xr[1]); } } }
  if(RN.pathM.map) RN.pathM.map.offset.y+=vel*dt/(240/RN.pathM.map.repeat.y);
  if(RN.sideM.map&&RN.side.visible) RN.sideM.map.offset.y+=vel*dt/8;
  if(RN.lavaTex) RN.lavaTex.offset.y+=dt*.05+vel*dt/40; if(RN.fallTex) RN.fallTex.offset.y+=dt*1.4;
  { const p=RN.motes.geometry.attributes.position; for(let i=0;i<p.count;i++){ let z=p.getZ(i)+vel*dt*.9+(RN.biome==='volcano'?dt*.6:0); let y=p.getY(i)+(RN.biome==='volcano'?dt*.5:Math.sin(t+i)*dt*.2); if(z>10){ z-=100; } if(y>10) y=.3; p.setZ(i,z); p.setY(i,y); } p.needsUpdate=true; }
  for(const a of RN.anim){ if(a.f==='birdFar'){ a.p+=dt*.4; a.o.position.x=Math.cos(a.p)*a.r; a.o.position.z=-50+Math.sin(a.p)*a.r; a.o.rotation.y=-a.p; flap(a.o,t*8); } else if(a.f==='smoke'&&Math.random()<dt*2){ const p=a.o.position.clone(); p.y=a.top+2; sprite(p,12,28,4,C(.25,.18,.16),true); } }
  // camera
  if(mode==='menu'){ camera.position.set(2.4+Math.sin(t*.15)*.6,2.2+Math.sin(t*.2)*.15,-5.4); camera.lookAt(-1.15,1.15,0); if(Math.random()<dt*.08&&RN.robo.cur===RN.robo.A.Idle) { playAnim(RN.robo,'Wave',.3,true); setTimeout(()=>{ if(K.mode==='menu') playAnim(RN.robo,'Idle',.4); },2600); } RN.roboG.visible=true; if(RN.robo.cur!==RN.robo.A.Idle&&RN.robo.cur!==RN.robo.A.Wave) playAnim(RN.robo,'Idle'); return; }
  if(mode==='cine'){ camera.position.set(-3.2+Math.sin(t*.2)*.6,2.2,-4.2); camera.lookAt(0,1.4,4); RN.dinoG.position.set(0,0,9); if(RN.robo.cur!==RN.robo.A.Idle) playAnim(RN.robo,'Idle'); if(RN.dino.cur!==RN.dino.A.idle) playAnim(RN.dino,'idle'); return; }
  const shakeY=Math.sin(t*16)*.03*(RN.curV||0)/10;
  camera.position.set(4.4+mx*.6,3.1-my*.3+shakeY,6.6); camera.lookAt(-.8+mx*.6,1.3,-6);
  if(!play){ if(RN.caught){ RN.curV=Math.max(0,(RN.curV||0)-dt*12); } updObs(dt,0); dinoPos(dt); return; }
  const lv=K.level; const prog=clamp(RN.dist/lv.goal,0,1);
  RN.speed=lerp(lv.speed[0],lv.speed[1],prog); RN.boost=Math.max(0,RN.boost-dt); RN.slow=Math.max(0,RN.slow-dt);
  RN.curV=RN.speed*(1+(RN.boost>0?.35:0))*(RN.slow>0?.55:1); RN.dist+=RN.curV*dt;
  RN.robo.A.Running.timeScale=RN.curV/8;
  // khoảng cách khủng long
  if(K.time<2.2) RN.gap=Math.min(24,RN.gap+dt*8); else RN.gap+=dt*(lv.drift+(K.combo>=10?.45:0)+(RN.boost>0?1.6:0)-(RN.slow>0?2:0)-(RN.charge?1.2:0));
  RN.gap=Math.min(40,RN.gap);
  if(RN.gap<=0&&!RN.caught){ caught(); return; }
  // sinh chướng ngại / ngọc / đẩy cột / cổng
  if(!RN.finish&&RN.dist>=RN.nextAt&&!RN.pushO){ if(RN.dist>lv.goal-70){ RN.finish=true; spawnGate(); } else { const kinds=lv.kinds; let tot=0; for(const k in kinds) tot+=kinds[k]; let r=Math.random()*tot, kind='log'; for(const k in kinds){ r-=kinds[k]; if(r<=0){ kind=k; break; } } spawnObstacle(kind); if(Math.random()<lv.gem) setTimeout(()=>{ if(K.mode==='play'&&!K.over) spawnGem(); },rand(500,900)); RN.nextAt=RN.dist+rand(lv.every[0],lv.every[1])*(1+prog*.15); } }
  if(RN.pushes.length&&RN.dist>=RN.pushes[0]&&!RN.pushO){ RN.pushes.shift(); spawnPush(); }
  updObs(dt,RN.curV); dinoPos(dt);
  // động tác
  const A=RN.act, B=RN.roboBody; if(A){ A.t+=dt; const k=clamp(A.t/A.dur,0,1);
    if(A.kind==='jump'||A.kind==='long'){ B.position.y=Math.sin(k*Math.PI)*(A.kind==='long'?1.7:1.35); B.rotation.x=0; }
    else if(A.kind==='slide'){ const e=Math.sin(Math.min(1,k*1.25)*Math.PI); B.rotation.x=e*1.05; B.position.y=-e*.12; B.position.z=e*.4; if(Math.random()<.5) sprite(new V3(rand(-.3,.3),.1,.6),.4,1.2,.5,C(.6,.55,.45),true); }
    else if(A.kind==='trip'){ B.rotation.x=-Math.sin(k*Math.PI)*.5; B.position.y=Math.sin(k*Math.PI)*.25; }
    if(k>=1){ RN.act=null; B.rotation.x=0; B.position.set(0,0,0); playAnim(RN.robo,'Running',.15); } }
  // tiến độ HUD
  $('#n-m').textContent=Math.floor(RN.dist); $('#n-fill').style.width=(prog*100).toFixed(1)+'%'; $('#n-robo').style.left=(prog*100).toFixed(1)+'%';
  const gp=clamp(RN.gap/40,0,1); $('#n-gap').textContent=Math.max(0,RN.gap).toFixed(0)+' m'; $('#n-gapbar').style.width=(gp*100).toFixed(1)+'%'; $('#n-chase').classList.toggle('danger',RN.gap<8);
  const a=$('#n-act'); if(a){ const lab=RN.boost>0?'BỨT TỐC':RN.slow>0?'VẤP NGÃ':''; if(a.textContent!==lab){ a.textContent=lab; a.className=RN.boost>0?'boost':RN.slow>0?'trip':''; } }
  if(RN.gap<6&&Math.random()<dt*.6) roar();
  checkGate(); musicTick();
}
function flap(b,ph){ if(b.userData.w) b.userData.w.forEach(w=>{ w.rotation.z=w.userData.s*Math.sin(ph)*.7; }); }
function updObs(dt,v){ for(const O of RN.obs.slice()){
    if(O.kind==='push'){ O.t+=dt; if(O.fall){ O.fall=Math.min(1,O.fall+dt*1.6); O.g.rotation.z=-O.fall*O.fall*1.5; O.g.position.z+=v*dt; if(O.fall>=1&&!O.boom){ O.boom=1; explosion(new V3(2,1,4),{size:1.6,big:true,color:C(1.4,1,.7),floor:0}); K.shake=1; } if(O.g.position.z>24) killObs(O); }
      else if(K.mode==='play'&&!K.over){ O.anchor.set(-2.4,4.2,0); O.center.set(-2.4,3,0); const left=O.limit-O.t; if(O.tg) O.tg.label='Đẩy cột! · còn '+Math.max(0,left).toFixed(1)+' giây'; if(O.tg) drawTag(O.tg); if(left<=0){ RN.charge=0; RN.gap-=8; stumbleSimple('Không kịp đẩy cột!'); killObs(O); } }
      continue; }
    O.g.position.z+=v*dt; const z=O.g.position.z;
    if(O.kind==='gem'){ O.g.userData.c.rotation.y+=dt*3; O.g.position.y=1.6+Math.sin(K.clock*3+O.side)*.12; if(O.cleared){ O.fly=(O.fly||0)+dt*2.4; const k=Math.min(1,O.fly); O.g.position.lerpVectors(O.from,new V3(0,1.2,0),k); O.g.scale.setScalar(1-k*.8); if(k>=1) killObs(O); } else if(z>2) killObs(O); }
    else { if(O.g.userData.birds){ O.g.userData.birds.forEach((b,i)=>flap(b,K.clock*12+i)); O.g.position.y=Math.sin(K.clock*2)*.08; }
      if(!O.acted&&z>-2.3){ O.acted=true; if(O.cleared) doAct(O.act); }
      if(!O.hitDone&&z>-.6){ O.hitDone=true; if(!O.cleared&&K.mode==='play'&&!K.over){ if(O.tg){ removeTarget(O.tg); O.tg=null; } stumble(O); O.g.visible=O.act==='long'; } }
      if(z>16) killObs(O); }
    O.anchor.copy(O.g.position).add(new V3(O.kind==='gem'?0:-.2,O.kind==='gem'?.75:O.h+.65,0)); O.center.copy(O.g.position).add(new V3(0,O.kind==='gem'?0:O.h*.5,0)); } }
function stumbleSimple(msg){ RN.stumbles++; K.extra.stumbles=RN.stumbles; K.combo=0; RN.slow=1; K.shake=1; K.hurtFx=1; roar(); say('lan',msg,true); }
function dinoPos(dt){ const D=RN.dinoG; const target=RN.caught?1.2:clamp(1.6+RN.gap*.42,1.6,20); D.position.z=lerp(D.position.z,target,1-Math.exp(-dt*3)); D.position.x=lerp(D.position.x,RN.caught?0:.6+Math.sin(K.clock*.7)*.5,1-Math.exp(-dt*2)); D.visible=D.position.z<16;
  RN.dino.A.sprint.timeScale=Math.max(.6,(RN.curV||8)/8); RN.dinoEye.intensity=RN.gap<10?3*(1-RN.gap/10):0; }
function caught(){ RN.caught=true; K.over=false; playAnim(RN.dino,'attack',.1,true); roar(); screenFlash(.5,600); setTimeout(()=>{ playAnim(RN.robo,'Death',.1,true); },250); RN.mus=false; lose('Khủng long đuổi kịp Tí'); }
function spawnGate(){ const g=new THREE.Group(); const st=stdM(RN.biome==='volcano'?0x6a4a38:RN.biome==='cave'?0x5a5868:0x9a9a88), gold=new THREE.MeshStandardMaterial({color:0xffc83a,metalness:1,roughness:.25,emissive:new THREE.Color(.6,.35,.05)});
  for(const s of [-1,1]){ mesh(g,new THREE.BoxGeometry(1.4,7.5,1.4),st,s*3.2,3.75,0,true); mesh(g,new THREE.BoxGeometry(1.9,.6,1.9),st,s*3.2,7.8,0,true); }
  mesh(g,new THREE.BoxGeometry(8.4,1.3,1.6),st,0,8.4,0,true); const sun=mesh(g,new THREE.CylinderGeometry(1.3,1.3,.3,32),gold,0,8.4,.9); sun.rotation.x=Math.PI/2;
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:C(4,2.6,.8),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})); glow.scale.setScalar(7); glow.position.set(0,8.4,1); g.add(glow);
  const veil=mesh(g,new THREE.PlaneGeometry(5,7.2),new THREE.MeshBasicMaterial({color:new THREE.Color(2,1.6,.7),transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}),0,3.6,0);
  g.position.set(0,0,-64); scene.add(g); const O={g,kind:'gate',act:'gate',h:8,done:false,cleared:true,acted:true,hitDone:true,anchor:new V3(),center:new V3()}; RN.obs.push(O); RN.gateO=O; say('lan','Thấy cổng rồi! Chạy hết sức!'); }
function checkGate(){ const O=RN.gateO; if(!O||K.over) return; if(O.g.position.z>-.5){ RN.gateO=null; finishRun(); } }
function finishRun(){ const lv=K.level; RN.mus=false; RN.curV=0; for(const O of RN.obs.slice()) if(O.kind!=='gate') killObs(O); playAnim(RN.robo,'Dance',.3); playAnim(RN.dino,'no',.2);
  sparks(new V3(0,2,-1),80,6,C(3,2.4,.8),.8); SFX.power(); K.score+=Math.round(RN.gems*200+Math.max(0,RN.gap)*40); win({title:lv.boss?'Cổng Mặt Trời đã đóng':'Tới đích an toàn'}); }

/* ---------------- nhạc trống rừng ---------------- */
const PENTA=[0,2,4,7,9,12,14,16];
function musicTick(){ const c=SFX.ctx; if(!c||!RN.mus) return; if(RN.mt<c.currentTime) RN.mt=c.currentTime+.05; const step=60/RN.bpm/4;
  while(RN.mt<c.currentTime+.2){ const s=RN.ms%16, t=RN.mt, bar=Math.floor(RN.ms/16)%4; const root=[57,57,53,55][bar];
    if(s===0||s===8||s===10) SFX.tone(120,.22,'sine',.5,42,t,SFX.music,true);
    if(s===4||s===12){ SFX.tone(210,.16,'sine',.28,110,t,SFX.music,true); SFX.noise(.08,.18,'bandpass',1800,900,1,t,SFX.music,true); }
    if(s%2===1) SFX.noise(.04,.07,'highpass',7000,9000,.6,t,SFX.music,true);
    if(s===14) SFX.tone(160,.14,'sine',.22,90,t,SFX.music,true);
    if(s%4===0) SFX.tone(440*Math.pow(2,(root-12-69)/12),.3,'triangle',.16,null,t,SFX.music,true);
    if(s%2===0&&Math.random()<.55){ const n=root+pick(PENTA); SFX.tone(440*Math.pow(2,(n-69)/12),.22,'sine',.07,null,t,SFX.music,true); SFX.tone(440*Math.pow(2,(n+12-69)/12),.08,'triangle',.03,null,t,SFX.music,true); }
    RN.mt+=step; RN.ms++; } }

KIT.boot(GAME);

})();
</script>
