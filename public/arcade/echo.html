<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>echo</title>
<link rel="stylesheet" href="fonts/echo.css">
<style>
/* ===== Tuhoc Typing · bộ khung game 3D (mỗi game đổi biến màu/font ở :root của riêng nó) ===== */
:root{ --vh:1vh; --vw:1vw;
  --bg:#05070c; --ink:#eef4ff; --muted:#9aaccb; --acc:#5ef0ff; --acc2:#ffb547; --bad:#ff4d5e; --good:#6dff9e;
  --oncyc:#041018; --glass:rgba(8,12,20,.76); --line:rgba(150,200,255,.2); --tagbg:rgba(6,12,20,.82);
  --display:'Chakra Petch',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif; --mono:'JetBrains Mono','Cascadia Mono',Consolas,ui-monospace,monospace;
  --rad:0px; --glow:rgba(94,240,255,.55); --dtrans:uppercase; --dls:.03em;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#tags,#fxl,#lockl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#lines line{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 6;opacity:.75;filter:drop-shadow(0 0 4px var(--glow))}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0}
.eyebrow{font:600 11px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}

/* ---- nhãn chữ trên mục tiêu ---- */
.tag{position:absolute;left:0;top:0;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform;transition:opacity .15s}
.tag .w{font:700 17px/1.32 var(--mono);padding:4px 9px 3px;background:var(--tagbg);border:1px solid var(--line);color:var(--ink);white-space:pre;border-radius:var(--rad);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tag .w b{color:var(--acc);text-shadow:0 0 10px var(--glow)}
.tag .w .nx{background:var(--acc);color:var(--oncyc);border-radius:2px}
.tag .d{font:600 10.5px/1.2 var(--mono);color:#c9d3e3;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 3px #000}
.tag.on .w{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px var(--glow)}
.tag.hot .w{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad),0 0 20px rgba(255,77,94,.5)}
.tag.hot .d{color:var(--bad)}
.tag.gold .w{border-color:var(--acc2);color:#fff3d6}
.tag.gold .d{color:var(--acc2)}
.tag.bad .w{border-color:var(--bad);background:rgba(40,6,10,.85)}
.tag.bad .d{color:var(--bad)}
.tag.boss .w{font-size:21px;border-color:var(--bad)}
.tag.big .w{font-size:24px;padding:6px 12px 4px}
.tag.dim{opacity:.4}

/* ---- tâm ngắm ---- */
#lock{position:absolute;left:0;top:0;width:100px;height:100px;--rc:var(--acc)}
#lock.hot{--rc:var(--bad)}
#lock svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px var(--glow))}
#lock svg *{fill:none;stroke:var(--rc);vector-effect:non-scaling-stroke}
#lock .ro path{stroke-width:2.2}
#lock .ri circle{stroke-width:1;stroke-dasharray:2 5;opacity:.7}
#lock .pg{stroke-width:3;stroke-linecap:round;stroke-dasharray:0 100}
#lock .br path{stroke-width:2.4}
#lock .ro,#lock .ri,#lock .br{transform-box:view-box;transform-origin:center}

/* ---- hiệu ứng chữ ---- */
.pop{position:absolute;left:0;top:0;font:700 18px/1.2 var(--display);color:var(--acc2);text-shadow:0 0 12px rgba(0,0,0,.6);animation:rise .9s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.good{color:var(--good)} .pop.bad{color:var(--bad)} .pop.big{font-size:28px}
@keyframes rise{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -54px}}
.hm{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;animation:hm .25s ease-out forwards}
.hm i{position:absolute;left:50%;top:50%;width:9px;height:2px;background:#fff;box-shadow:0 0 8px var(--glow)}
.hm i:nth-child(1){transform:translate(-50%,-50%) rotate(45deg) translateX(-11px)}
.hm i:nth-child(2){transform:translate(-50%,-50%) rotate(135deg) translateX(-11px)}
.hm i:nth-child(3){transform:translate(-50%,-50%) rotate(225deg) translateX(-11px)}
.hm i:nth-child(4){transform:translate(-50%,-50%) rotate(315deg) translateX(-11px)}
@keyframes hm{0%{opacity:1;scale:.7}40%{opacity:1;scale:1.1}100%{opacity:0;scale:1.3}}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .tl{position:absolute;left:18px;top:14px;max-width:calc(46*var(--vw))}
#h-stat{font:700 22px/1.25 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#h-sub{font:500 12.5px/1.45 var(--mono);color:var(--muted);margin-top:2px}
#hud .btns{display:flex;gap:6px;margin-top:10px;pointer-events:auto}
.hb{cursor:pointer;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad)}
.hb:hover{border-color:var(--acc)}
#hud .tr{position:absolute;right:18px;top:12px;text-align:right}
/* 14/10/2026: nút về app ngay khi đang chơi (chỉ hiện trong app), nằm bên trái khối điểm */
#hud .tr .h-exit{position:absolute;right:calc(100% + 16px);top:3px;pointer-events:auto;display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,20,.74);color:#fff;font:600 13px/1 var(--body);letter-spacing:0;text-transform:none;white-space:nowrap;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
#hud .tr .h-exit[hidden]{display:none}
#hud .tr .h-exit svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
#hud .tr .h-exit:hover,#hud .tr .h-exit:focus-visible{background:#c42b1c;border-color:#ff8a7a;outline:none}
#h-score{font:700 34px/1.1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#h-combo{font:700 14px/1.3 var(--display);color:var(--acc2);min-height:18px;letter-spacing:.05em}
#h-xp{font:600 12px/1.4 var(--mono);color:var(--good)}
#h-extra{font:600 11.5px/1.5 var(--mono);color:var(--acc2);margin-top:4px;max-width:calc(34*var(--vw))}
#hud .bl{position:absolute;left:18px;bottom:16px}
#h-hpl{display:block;font:600 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#h-hp{display:flex;gap:4px}
#h-hp i{width:20px;height:8px;background:var(--acc);box-shadow:0 0 8px var(--glow);transform:skewX(-20deg);border-radius:calc(var(--rad)/3)}
#h-hp i.off{background:rgba(255,255,255,.12);box-shadow:none}
#h-hp.low i:not(.off){background:var(--bad);box-shadow:0 0 8px rgba(255,77,94,.7)}
#hud .br{position:absolute;right:18px;bottom:16px;font:500 12.5px/1.3 var(--mono);color:var(--muted)}
#hud .br b{color:var(--ink)}
#bossbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(520px,calc(60*var(--vw)));pointer-events:none}
#bossbar .bn{display:flex;justify-content:space-between;font:600 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bad);margin-bottom:5px}
#bossbar .bn small{color:var(--muted)}
#bossbar .bt{height:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,77,94,.35);border-radius:var(--rad);overflow:hidden}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--acc2));transition:width .25s}

/* ---- thanh chữ đang gõ ---- */
#tbar{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;pointer-events:none;padding:10px 16px 9px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(6px)}
#tbar .who{font:600 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
#tbar .wd{font:700 30px/1.36 var(--mono);white-space:pre;padding:2px 12px;border:1px solid var(--line);border-radius:var(--rad)}
#tbar .wd b{color:var(--acc);text-shadow:0 0 12px var(--glow)}
#tbar .wd u{text-decoration:none;background:var(--acc);color:var(--oncyc);padding:0 3px;border-radius:2px}
#tbar .wd i{font-style:normal;color:var(--ink);opacity:.85}
#tbar .keys{display:flex;gap:6px;justify-content:center}
#tbar .words{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;max-width:min(560px,calc(100vw - 40px))}
#tbar .words span{font:600 20px/1 var(--body);padding:7px 11px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:var(--rad)}
#tbar .words b{color:var(--acc);font-weight:800}
#tbar .keys span{font:700 18px/1 var(--mono);min-width:34px;padding:8px 9px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:var(--rad)}
#tbar .hint{margin-top:7px;font-size:12.5px;line-height:1.5;color:var(--muted)}
#tbar .hint .tk{color:var(--acc2)}
#tbar .hint .bad{color:var(--bad)}
#tbar.err{animation:shake .25s}
@keyframes shake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}

/* ---- banner / radio ---- */
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s}
#banner.show{opacity:1}
#banner h2{font:700 clamp(30px,calc(5*var(--vw)),58px)/1.18 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);text-shadow:0 0 30px var(--glow),0 3px 18px rgba(0,0,0,.7)}
#banner p{margin-top:8px;font:600 13px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc2);text-shadow:0 2px 10px #000}
#comm{position:fixed;left:18px;bottom:62px;width:min(420px,calc(100% - 36px));display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--rad);opacity:0;translate:-12px 0;transition:opacity .25s,translate .25s;pointer-events:none;backdrop-filter:blur(6px)}
#comm.show{opacity:1;translate:0 0}
#comm.warn{border-left-color:var(--bad)}
.av{width:46px;height:46px;flex:none;border-radius:calc(var(--rad) + 4px);overflow:hidden;background:rgba(255,255,255,.05)}
.av svg{width:100%;height:100%;display:block}
.nm{font:700 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.tx{font-size:14px;line-height:1.5;margin-top:3px}

/* ---- cutscene ---- */
#cine{position:fixed;inset:0;z-index:20}
#cine .bar{position:absolute;left:0;right:0;height:calc(11*var(--vh));background:#000}
#cine .bar.t{top:0} #cine .bar.b{bottom:0}
#cine .loc{position:absolute;left:28px;top:calc(11*var(--vh) + 18px);font:600 12px/1.4 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--acc);text-shadow:0 2px 8px #000}
#cine .dlg{position:absolute;left:50%;bottom:calc(11*var(--vh) + 22px);transform:translateX(-50%);width:min(760px,calc(100% - 32px));display:flex;gap:16px;padding:16px 18px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);cursor:pointer;backdrop-filter:blur(8px)}
#cine .av{width:64px;height:64px}
#cine .tx{font-size:16.5px;line-height:1.6;min-height:52px}
#cine .nx{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.skip{cursor:pointer;background:none;border:1px solid var(--line);padding:6px 10px;color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:var(--rad)}
.skip:hover{color:var(--ink);border-color:var(--acc)}

/* ---- menu ---- */
#menu{position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr;pointer-events:none}
#menu>*{pointer-events:auto}
.m-left{display:flex;flex-direction:column;gap:14px;padding:22px 18px 18px 24px;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.42) 70%,transparent);min-height:0}
.m-left h1{font:700 clamp(28px,calc(3*var(--vw)),40px)/1.12 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:6px;text-shadow:0 0 24px var(--glow)}
.m-left h1 em{font-style:normal;color:var(--acc)}
.m-tag{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:6px;max-width:330px}
.m-total{font:600 11.5px/1.4 var(--mono);color:var(--muted);margin-top:8px}
.lvlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.lv{cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 12px;background:rgba(10,14,22,.62);border:1px solid var(--line);border-radius:var(--rad)}
.lv:hover{border-color:var(--acc)}
.lv[aria-pressed="true"]{border-color:var(--acc);background:rgba(20,30,44,.86);box-shadow:inset 3px 0 0 var(--acc)}
.lv .no{font:700 19px/1 var(--display);color:var(--acc);text-align:center}
.lv .nm2{display:block;font:600 14.5px/1.3 var(--body)}
.lv .sub{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);margin-top:2px}
.lv.locked{opacity:.5}
.st{display:flex;gap:2px}
.st i{width:11px;height:11px;background:rgba(255,255,255,.15);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.st i.on{background:var(--acc2)}
.m-set{display:grid;gap:7px;padding-top:10px;border-top:1px solid var(--line)}
.m-set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.m-set .row>span{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:66px}
.chip{cursor:pointer;font:600 12.5px/1.2 var(--body);padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:var(--rad)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--oncyc);border-color:var(--acc)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.m-detail{position:absolute;right:24px;bottom:24px;width:min(500px,calc(100% - 48px));padding:22px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(10px)}
.m-detail h2{font:700 clamp(26px,calc(3*var(--vw)),38px)/1.15 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:6px}
.m-detail .desc{margin-top:10px;font-size:14.5px;line-height:1.6;color:#d4deee}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font:600 11.5px/1.3 var(--mono);padding:5px 8px;border:1px solid var(--line);color:var(--muted);border-radius:var(--rad)}
.meta span.a{color:var(--acc2);border-color:rgba(255,181,71,.4)}
.meta span.g{color:var(--good);border-color:rgba(109,255,158,.35)}
.go{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{cursor:pointer;font:700 15px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--acc);background:var(--acc);color:var(--oncyc);border-radius:var(--rad)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.lnk{cursor:pointer;background:none;border:0;color:var(--acc);font:500 13px/1.4 var(--body);text-decoration:underline;text-underline-offset:3px}
.fine{margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--muted)}
kbd{font:600 11px/1 var(--mono);padding:2px 5px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.06)}
#loadmsg{font:500 12.5px/1.4 var(--mono);color:var(--muted)}

/* ---- bảng kết quả ---- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(2,4,8,.55);z-index:25}
.panel{width:min(600px,100%);max-height:calc(100*var(--vh) - 24px);overflow-y:auto;background:var(--glass);border:1px solid var(--line);padding:26px;border-radius:var(--rad);backdrop-filter:blur(10px)}
.panel h1{margin-top:10px;font:700 clamp(30px,calc(4.4*var(--vw)),50px)/1.14 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);text-shadow:0 0 26px var(--glow)}
.stars{display:flex;gap:8px;margin-top:14px}
.stars i{width:34px;height:34px;background:rgba(255,255,255,.12);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--acc2);filter:drop-shadow(0 0 10px var(--acc2))}
.xpbox{margin-top:14px;padding:10px 12px;border:1px solid rgba(109,255,158,.35);font-size:14px;line-height:1.55;border-radius:var(--rad)}
.xpbox b{color:var(--good)}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{border:1px solid var(--line);padding:9px 10px;border-radius:var(--rad)}
.stats span{display:block;font:600 10px/1.3 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stats b{display:block;margin-top:4px;font:700 21px/1.2 var(--display);font-variant-numeric:tabular-nums}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font:600 13px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);z-index:40}

@media (max-width:639px){
  #menu{grid-template-columns:1fr}
  .m-left{background:rgba(0,0,0,.6)}
  .lvlist{max-height:calc(34*var(--vh))}
  .m-detail{position:relative;right:auto;bottom:auto;margin:0 16px 16px;width:auto}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tbar{bottom:96px} #tbar .wd{font-size:22px}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

#imewarn{position:fixed;left:50%;top:72px;transform:translate(-50%,-8px);z-index:60;max-width:min(620px,calc(100% - 32px));padding:12px 16px;border-radius:10px;background:#2b1406;border:1px solid #ffb547;color:#ffe6c2;font:500 14px/1.5 system-ui,'Segoe UI',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#imewarn.show{opacity:1;transform:translate(-50%,0)}
#imewarn b{color:#ffcf7a}

/* Nút về app: góc phải trên như nút đóng quen thuộc */
.m-exit{position:absolute;top:16px;right:18px;z-index:5;pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:9px 15px 9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,20,.74);color:#fff;font:600 14px/1 var(--body);letter-spacing:0;text-transform:none;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
.m-exit[hidden]{display:none}
.m-exit svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.m-exit:hover,.m-exit:focus-visible{background:#c42b1c;border-color:#ff8a7a;outline:none}
body.g-orbit.in-app .m-set{top:66px}
body.g-orbit.in-app .m-detail{top:176px}

.xpbox .xpn{display:block;margin-top:3px;font-size:.92em;opacity:.82}

/* 12/10/2026 — gõ tự do kiểu Telex như bộ gõ thật, bấm Space mới chấm cả âm tiết (giống màn gõ tiểu thuyết):
   thứ tự phím tuỳ ý (vieejn, vieenj… đều đúng), chỉ so kết quả. state: {done, raw, comp}.
   Trả về: phím thường → {ok,pend}; Space đúng → {ok,n (ký tự được tính),done}; Space sai → {ok:false,syl:true,n,got,want}. */
function viStep(st,word,ch,apply,locked){
  const S=viSyl(st,word); if(S.done>=word.length) return {ok:false};
  if(ch===' '){ if(!S.raw) return {ok:false,empty:true}; const comp=telexCompose(S.raw);
    if(viEq(comp,S.target)){ const n=[...S.target.normalize('NFC')].length+(S.sp>=0?1:0); if(apply){ st.done=S.sp<0?word.length:S.end+1; st.raw=''; st.comp=''; } return {ok:true,done:S.sp<0,n}; }
    const n=viDiff(comp,S.target); if(apply){ st.raw=''; st.comp=''; } return {ok:false,syl:true,n,got:comp,want:S.target}; }
  // chữ cái đầu chỉ dùng để CHỌN mục tiêu; đã khoá mục tiêu thì cứ nhận phím, bấm Space mới chấm (không trừ dồn từng phím)
  if(!locked&&!S.raw&&S.done===0&&!viCompat(telexCompose(ch),S.target)) return {ok:false};
  if(S.raw.length>=S.target.length*3+6) return {ok:false};
  const nraw=S.raw+ch; if(apply){ st.raw=nraw; st.comp=telexCompose(nraw); } return {ok:true,pend:true,done:false};
}
function viBack(st){ if(!st.raw) return; let r=st.raw.slice(0,-1); if(r.endsWith('`')) r=r.slice(0,-1); st.raw=r; st.comp=telexCompose(r); }
/* gợi ý: key = phím kế theo Telex chuẩn (dùng cho test tự động / chữ cái đầu), keys = cả chuỗi Telex của âm tiết */
function viHint(st,word){
  const S=viSyl(st,word); if(S.done>=word.length) return {key:'',label:'',keys:''};
  const keys=viTelexKeys(S.target); const comp=telexCompose(S.raw);
  const last=S.sp<0, multi=word.indexOf(' ')>=0;
  if(S.raw&&viEq(comp,S.target)) return {key:' ',label:'dấu cách',keys,ready:true,last,multi};
  const r=S.raw.toLowerCase(); if(keys.startsWith(r)){ const k=keys[r.length]; return {key:k,label:k,keys,last,multi}; }
  return {key:' ',label:'',keys,off:!viCompat(comp,S.target),last,multi};
}
/* 13/10/2026 — dòng nhắc dưới thanh gõ. Dấu cách cuối câu không nhìn thấy nên nói rõ: chữ cuối cũng phải bấm Space mới xong. */
function viHintHtml(h,E,verb){ const K='<kbd>Space</kbd>', tk='<span class="tk">'+E(h.keys||'')+'</span>';
  if(h.ready) return h.last?'<b class="vgo">Gõ xong rồi, bấm '+K+' để '+verb+'</b>':'Đủ chữ rồi, bấm '+K+' sang chữ tiếp';
  if(h.last&&h.multi) return 'Chữ cuối: '+tk+' rồi bấm '+K+' để '+verb;
  return 'Telex: '+tk+' rồi '+K+(h.last?' để '+verb:''); }

/* 13/10/2026 — CHỮ MẪU luôn giữ nguyên (không bị chữ người gõ đè lên).
   Mẫu: phần đã xong tô màu, âm tiết đang gõ gạch chân (khớp → tô dần theo mẫu; lệch → gạch đỏ).
   Chữ người đang gõ hiện RIÊNG ở ô "Bạn đang gõ" (viInputHtml) dưới mẫu. */
function viSampleHtml(st,word,E,on){ const S=viSyl(st,word); if(S.done>=word.length) return '<b>'+E(word)+'</b>';
  const tg=[...S.target], comp=S.raw?telexCompose(S.raw):'', ok=!S.raw||viCompat(comp,S.target), n=ok?Math.min(tg.length,[...comp].length):0;
  const cur=on?'<span class="cur'+(ok?'':' bad')+'">'+(n?'<b>'+E(tg.slice(0,n).join(''))+'</b>':'')+E(tg.slice(n).join(''))+'</span>':E(S.target);
  // chữ cuối: thêm phím "Space" nhìn thấy được ở cuối mẫu (đủ chữ thì nhấp nháy)
  const end=on&&S.sp<0?'<kbd class="vend'+(S.raw&&viEq(comp,S.target)?' go':'')+'">Space</kbd>':'';
  return (S.done?'<b>'+E(word.slice(0,S.done))+'</b>':'')+cur+E(word.slice(S.end))+end; }
function viInputHtml(st,word,E){ const S=viSyl(st,word); if(!S.raw||S.done>=word.length) return ''; const comp=telexCompose(S.raw), ok=viCompat(comp,S.target);
  return '<div class="vin'+(ok?'':' bad')+'"><span>'+(ok?'Bạn đang gõ':'Bạn gõ lệch')+'</span><b>'+E(comp)+'</b><em>phím: '+E(S.raw)+'</em>'+(ok?'':'<span>mẫu: <i>'+E(S.target)+'</i></span>')+'</div>'; }

/* =====================================================================
   Chọn mức đồ hoạ — dùng chung 6 game (13/10/2026)
   Lưu ở localStorage 'tg_gfx' = auto | high | low. Các trang game cùng origin nên chọn 1 lần là áp cho mọi game.
   - Lần đầu vào: hộp chọn hiện giữa màn, có đề xuất theo card đồ hoạ của máy.
   - Máy yếu mà chọn Cao: cảnh báo, hỏi lại.
   - Sau đó đổi lại ở chip "Đồ hoạ" trong menu hoặc nút "Đồ hoạ" góc trên khi đang chơi.
   - Tự động: game đo độ mượt, tự hạ/nâng phát sáng và độ nét 3D. Cao/Nhẹ: giữ cố định.
   Engine (kit.js / core.js) cần có: GPU_WEAK, GPU_NAME, WEBGL2, store, esc, và gọi gfxBoot({apply, hold, zoom}).
   ===================================================================== */
const GFX_MODES=['auto','high','low'];
const GFX={mode:'auto',open:false,first:false,lagHinted:false,hooks:{}};
function gfxStoredMode(){ const m=store('tg_gfx'); return GFX_MODES.includes(m)?m:null; }
function gfxRec(){ return (!WEBGL2||GPU_WEAK)?'low':'high'; }
function gfxEff(mode){ return !WEBGL2?'low':(mode==='auto'?gfxRec():mode); }
const GFX_NAME={auto:'Tự động',high:'Cao',low:'Nhẹ'};
function gfxBoot(hooks){ GFX.hooks=hooks||{}; const m=gfxStoredMode(); GFX.first=!m; GFX.mode=m||'auto'; gfxCss(); gfxSync();
  addEventListener('keydown',gfxKey,true); }
/* chip/nút trên giao diện: [data-gfx="auto|high|low"] và [data-gfx-open] */
function gfxSync(){ document.querySelectorAll('[data-gfx]').forEach(b=>{ b.setAttribute('aria-pressed',String(b.dataset.gfx===GFX.mode)); if(!WEBGL2&&b.dataset.gfx==='high') b.disabled=true;
    if(!b._gfx){ b._gfx=1; b.addEventListener('click',e=>{ e.currentTarget.blur(); gfxPick(b.dataset.gfx,false); }); } });
  document.querySelectorAll('[data-gfx-open]').forEach(b=>{ b.textContent='Đồ hoạ: '+GFX_NAME[GFX.mode]; if(!b._gfx){ b._gfx=1; b.addEventListener('click',e=>{ e.currentTarget.blur(); gfxOpen(false); }); } }); }
function gfxSet(mode){ if(!GFX_MODES.includes(mode)) return; GFX.mode=mode; store('tg_gfx',mode); GFX.lagHinted=false; const n=document.getElementById('perfnote'); if(n) n.classList.remove('show');
  if(GFX.hooks.apply) GFX.hooks.apply(gfxEff(mode),mode); gfxSync(); }
/* chọn từ chip hoặc hộp: máy yếu chọn Cao → hỏi lại */
function gfxPick(mode,fromDlg){ if(mode==='high'&&WEBGL2&&GPU_WEAK&&GFX.mode!=='high'){ gfxOpen(!!GFX.first,'warn'); return; } gfxSet(mode); if(fromDlg) gfxClose(); }
function gfxVerdict(){ const g=GPU_NAME?'<b>'+esc(GPU_NAME)+'</b>':'<b>không rõ tên</b>';
  if(!WEBGL2) return 'Trình duyệt của máy không hỗ trợ WebGL 2, game chỉ chạy được đồ hoạ <b>Nhẹ</b>.';
  return GPU_WEAK?'Card đồ hoạ của máy: '+g+'. Đây là card tích hợp đời cũ, nên chơi <b>Tự động</b> hoặc <b>Nhẹ</b> để mượt.'
    :'Card đồ hoạ của máy: '+g+'. Máy đủ khoẻ để chơi <b>Cao</b>; chọn <b>Tự động</b> để game tự chỉnh khi cần.'; }
function gfxOpen(first,view){ let d=document.getElementById('gfxdlg'); if(!d){ d=document.createElement('div'); d.id='gfxdlg'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-labelledby','gfx-h'); document.body.appendChild(d); }
  GFX.first=!!first; const rec=gfxRec();
  if(view==='warn'){
    d.innerHTML=`<div class="gx-box warn"><h2 id="gfx-h">Máy bạn có thể không chạy mượt đồ hoạ Cao</h2>
      <p>Card đồ hoạ <b>${esc(GPU_NAME||'của máy')}</b> là card tích hợp đời cũ. Ở mức Cao, game dễ bị giật và gõ phím có thể bị trễ.</p>
      <p>Nên dùng <b>Tự động</b>: game tự hạ độ nét khi giật và nâng lại khi máy rảnh.</p>
      <div class="gx-act"><button type="button" class="gx-btn pri" data-gx="auto">Dùng Tự động</button><button type="button" class="gx-btn" data-gx="force-high">Vẫn chọn Cao</button><button type="button" class="gx-btn ghost" data-gx="back">Quay lại</button></div></div>`;
  } else {
    const card=(m,desc,tag)=>`<button type="button" class="gx-opt${GFX.mode===m&&!first?' cur':''}${m==='auto'?' rec':''}" data-gx="${m}" ${(!WEBGL2&&m==='high')?'disabled':''}>
      <span class="gx-k">${m==='auto'?1:m==='high'?2:3}</span><span class="gx-n">${GFX_NAME[m]}${m==='auto'?' <em>Đề xuất</em>':''}${tag?' <i>'+tag+'</i>':''}</span><span class="gx-d">${desc}</span>${GFX.mode===m&&!first?'<span class="gx-cur">Đang dùng</span>':''}</button>`;
    d.innerHTML=`<div class="gx-box"><span class="gx-eye">${first?'Lần đầu vào Khu Game':(GFX.hooks.playing&&GFX.hooks.playing()?'Cài đặt đồ hoạ · game đang tạm dừng':'Cài đặt đồ hoạ')}</span><h2 id="gfx-h">Chọn mức đồ hoạ</h2>
      <p class="gx-v">${gfxVerdict()}</p>
      <div class="gx-opts">${card('auto','Game đo độ mượt khi chơi, tự giảm phát sáng và độ nét lúc máy giật, tự nâng lại khi máy rảnh.','')}
        ${card('high','Hình đẹp nhất: phát sáng, khử răng cưa, đổ bóng, độ nét đầy đủ. Hợp máy có card rời.',rec==='high'?'Hợp máy bạn':(WEBGL2?'Có thể giật':''))}
        ${card('low','Mượt cho máy yếu: tắt phát sáng và khử răng cưa, giảm độ nét 3D. Chữ vẫn sắc nét.',rec==='low'?'Hợp máy bạn':'')}</div>
      <p class="gx-f">${first?'Bấm <kbd>Enter</kbd> để dùng mức đề xuất.':'<kbd>Esc</kbd> để đóng.'} Đổi lại bất cứ lúc nào ở nút <b>Đồ hoạ</b> góc trên khi chơi, hoặc ở menu.</p>
      ${first?'':'<button type="button" class="gx-x" data-gx="close" aria-label="Đóng">×</button>'}</div>`;
  }
  d.querySelectorAll('[data-gx]').forEach(b=>b.addEventListener('click',()=>{ const v=b.dataset.gx;
    if(v==='close') return gfxClose(); if(v==='back') return gfxOpen(GFX.first);
    if(v==='force-high'){ gfxSet('high'); return gfxClose(); }
    if(v==='high'&&WEBGL2&&GPU_WEAK) return gfxOpen(GFX.first,'warn');
    gfxSet(v); gfxClose(); }));
  if(GFX.hooks.zoom) d.style.zoom=GFX.hooks.zoom();
  d.hidden=false; if(!GFX.open&&GFX.hooks.hold) GFX.hooks.hold(true); GFX.open=true;
  const f=d.querySelector(view==='warn'?'.gx-btn.pri':(first?'.gx-opt.rec':'.gx-opt.cur'))||d.querySelector('button'); if(f) f.focus(); }
function gfxClose(){ const d=document.getElementById('gfxdlg'); if(d) d.hidden=true; if(GFX.open&&GFX.hooks.hold) GFX.hooks.hold(false); GFX.open=false;
  if(GFX.first){ GFX.first=false; if(!gfxStoredMode()) gfxSet('auto'); } }
/* hộp đang mở: chặn phím không cho lọt xuống game */
function gfxKey(e){ if(!GFX.open) return; e.stopImmediatePropagation();
  const d=document.getElementById('gfxdlg'); const warn=d&&d.querySelector('.gx-box.warn');
  if(e.key==='Escape'){ e.preventDefault(); if(warn) gfxOpen(GFX.first); else if(!GFX.first) gfxClose(); return; }
  if(!warn&&['1','2','3'].includes(e.key)){ e.preventDefault(); const m=['auto','high','low'][+e.key-1]; if(m==='high'&&WEBGL2&&GPU_WEAK) return gfxOpen(GFX.first,'warn'); gfxSet(m); gfxClose(); return; }
  if(e.key==='Enter'||e.key===' '){ const a=document.activeElement; if(a&&d&&d.contains(a)){ e.preventDefault(); a.click(); } else if(GFX.first&&!warn){ e.preventDefault(); gfxSet('auto'); gfxClose(); } return; }
  if(e.key==='Tab') return; e.preventDefault(); }
/* Cao (chọn tay) mà vẫn giật nặng → gợi ý 1 lần chuyển Tự động */
function gfxLagHint(){ if(GFX.lagHinted||GFX.mode!=='high') return; GFX.lagHinted=true; let el=document.getElementById('perfnote'); if(!el){ el=document.createElement('div'); el.id='perfnote'; el.setAttribute('role','status'); document.body.appendChild(el); }
  if(GFX.hooks.zoom) el.style.zoom=GFX.hooks.zoom();
  el.innerHTML='Game đang giật ở đồ hoạ <b>Cao</b>'+(GPU_NAME?' (card <b>'+esc(GPU_NAME)+'</b>)':'')+'. <button type="button" class="gx-mini" id="gx-toauto">Chuyển sang Tự động</button>';
  el.classList.add('show','act'); const b=document.getElementById('gx-toauto'); if(b) b.addEventListener('click',()=>{ gfxSet('auto'); el.classList.remove('show'); });
  setTimeout(()=>el.classList.remove('show'),12000); }

function perfTick(raw,active){ if(!R||navigator.webdriver||document.hidden||raw>1.5||!active||GFX.open){ pf.n=0; pf.acc=0; return; } pf.acc+=raw; pf.n++; if(pf.acc<1.5) return; const fps=pf.n/pf.acc; pf.n=0; pf.acc=0;
  // Cao/Nhẹ chọn tay: giữ cố định; Cao mà giật nặng thì gợi ý chuyển Tự động (1 lần)
  if(GFX.mode!=='auto'){ if(GFX.mode==='high'&&fps<32){ if(++pf.bad>=2){ pf.bad=0; gfxLagHint(); } } else pf.bad=0; return; }
  if(fps<38){ pf.good=0; if(++pf.bad<2) return; pf.bad=0;
    if(bloom&&bloom.enabled){ bloom.enabled=false; } else if(RS>RS_MIN+.001){ RS=Math.max(RS_MIN,Math.round((RS-.15)*100)/100); onResize(); } else return;
    perfNote(); }
  else { pf.bad=0; if(fps>56){ if(++pf.good>=3){ pf.good=0; if(RS<RS_TOP()-.001){ RS=Math.min(RS_TOP(),Math.round((RS+.1)*100)/100); onResize(); } else if(Q==='high'&&bloom&&!bloom.enabled) bloom.enabled=true; } } else pf.good=0; } }
/* đổi mức đồ hoạ ngay, không tải lại trang: dựng lại khâu hậu kỳ (MSAA/bloom), độ nét, đổ bóng */
function kitGfxApply(eff){ if(!R) return; const ch=Q!==eff; Q=eff; RS=Q==='high'?1:(GPU_WEAK?.75:.85); pf.n=pf.acc=pf.good=pf.bad=0;
  if(ch&&composer){ const old=composer, ob=bloom, ofp=finalPass; initPost(G.post);
    if(ofp&&finalPass) for(const k in ofp.uniforms){ const v=ofp.uniforms[k].value; if(finalPass.uniforms[k]&&typeof v==='number') finalPass.uniforms[k].value=v; }
    try{ old.renderTarget1.dispose(); old.renderTarget2.dispose(); if(ob&&ob.dispose) ob.dispose(); }catch(e){}
    scene.traverse(o=>{ if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ m.needsUpdate=true; }); }); }
  if(bloom) bloom.enabled=Q==='high'; onResize(); }
function frame(now){ requestAnimationFrame(frame); const raw=(now-last)/1000; perfTick(raw,K.ready&&(K.mode==='play'||K.mode==='menu')); const dt=Math.min(.05,raw); last=now; step(K.hold?0:dt*K.timeScale,dt); if(R&&composer) composer.render(); }
function step(dt,rdt){
  rdt=rdt==null?dt:rdt; K.clock+=dt;
  if(K.mode==='play'&&!K.over&&!K.paused){ K.time+=dt; }
  if(G.update) G.update(dt,K.mode);
  updateFX(dt);
  if(K.mode==='play'){ updateTags(rdt); K.barErrT=Math.max(0,(K.barErrT||0)-rdt); K.barT=(K.barT||0)-rdt; if(K.barT<=0){ K.barT=.25; drawBar(); } hudTick(); }
  if(K.shake>0&&!REDUCE){ camera.position.x+=rand(-1,1)*K.shake*.1; camera.position.y+=rand(-1,1)*K.shake*.1; }
  K.shake=Math.max(0,K.shake-rdt*2.4); K.hurtFx=Math.max(0,K.hurtFx-rdt*1.6);
  if(finalPass){ finalPass.uniforms.uTime.value=K.clock; finalPass.uniforms.uHurt.value=K.hurtFx; }
}

   {haz:tx('nép sát vào tường','hug the wall'),time:8,say:tx('Có tiếng tàu chạy rầm rầm phía sau! Đường ray đang rung!','A train is roaring up behind me! The rails are shaking!'),after:tx('Tàu chạy qua sát lưng mình. Gió thổi bay cả mũ… à mình không có mũ.','The train passed right behind me. It blew my hat off… oh, I do not wear one.')},
   {say:tx('Bên trái có cửa toa tàu đang hé mở, bên phải là đống gạch vụn cao.','On my left a carriage door is half open, on my right is a tall pile of rubble.'),
    opts:[OK('chui vào toa tàu','climb into the carriage',4),NO('trèo qua đống gạch','go over the rubble',[-3.6,1],'Gạch trượt dưới chân mình, suýt ngã. Đường này không được.','The bricks slid under my feet, I almost fell. Not this way.')],after:tx('Trong toa có mùi bánh mì cũ. Có người từng ăn sáng ở đây.','It smells of old bread in here. Someone had breakfast here once.')},
   {fix:tx('bật đèn pin hồng ngoại','turn on the infrared lamp'),say:tx('Trong toa tối quá, cảm biến nhiệt của mình bị lạnh cóng. Gõ lệnh sửa giúp mình.','It is too dark in here and my heat sensor is frozen. Type the repair command.'),after:tx('Mình cảm thấy hơi ấm! Có người ở phía trước!','I can sense warmth! There are people ahead!')},
   {say:tx('Phía trước có tiếng chuông báo của lối thoát hiểm. Bên trái có tiếng nước chảy xiết.','Ahead I hear the alarm bell of an emergency exit. On my left, water is rushing fast.'),
    opts:[OK('đi theo tiếng chuông','follow the alarm bell',6),NO('lội qua dòng nước','wade across the stream',[0,-.6],'Nước chảy mạnh quá, mình bị đẩy lùi. Thử đường khác nhé.','The current is too strong, it pushed me back. Another way please.')],after:tx('Tiếng chuông to dần. Mình nghe thấy cả tiếng người gọi.','The bell is louder. I can hear people calling too.')},
   {haz:tx('lăn sang bên phải','roll to the right'),time:7,say:tx('Trần hầm đang sụt! Có một khe hở bên phải!','The ceiling is collapsing! There is a gap on the right!'),after:tx('Thoát rồi! Bụi bám đầy người mình, chắc trông buồn cười lắm.','Made it! I am covered in dust, I must look funny.')},
   {say:tx('Bên trái có cầu thang cuốn đã dừng, phía trên có tiếng người gọi. Bên phải chỉ là bức tường.','On my left is a stopped escalator, people are calling from above. On my right is just a wall.'),
    opts:[OK('leo lên cầu thang cuốn','climb the escalator',8),NO('gõ vào tường gọi người','knock on the wall',[.4,3],'Tường dày quá, không ai nghe thấy. Lên cầu thang thôi.','The wall is too thick, no one hears. Let us take the stairs.')],after:tx('Mình tìm thấy họ rồi! Ba người, ai cũng an toàn!','I found them! Three people, all safe!'),end:true}],
  end:{vi:[{who:'echo',t:'Ba người được đưa lên rồi. Một bạn nhỏ hỏi tên mình. Mình bảo mình là ECHO, và có một người bạn dẫn đường.'},{who:'hq',t:'Làm tốt lắm, điều phối viên. Mai ECHO sẽ vào nhà máy bỏ hoang phía Bắc.'},{who:'echo',t:'Bạn ơi… sao trong bộ nhớ của mình đã có sẵn bản đồ nhà máy đó?'}],
       en:[{who:'echo',t:'All three are out. A little kid asked my name. I said I am ECHO, and I have a friend who guides me.'},{who:'hq',t:'Good work, dispatcher. Tomorrow ECHO goes into the abandoned north factory.'},{who:'echo',t:'Hey… why is the map of that factory already in my memory?'}]}},
 {name:'Nhà Máy Im Lặng',loc:'Nhà máy phía Bắc · 03:15',short:'Hai lệnh sửa máy dài',
  desc:'Nhà máy bỏ hoang phía Bắc, im lặng tới đáng sợ. Băng chuyền vẫn tự chạy, máy dập vẫn rung sàn. ECHO cần bật lại điện dự phòng, và ở cuối đường có một robot giống hệt nó đang nằm im.',
  meta:['8 ngã rẽ','2 lệnh sửa máy dài','!Băng chuyền tự chạy'],
  intro:[{who:'hq',t:'Nhà máy phía Bắc mất điện hai năm rồi. Cần ECHO bật lại điện dự phòng để mở cửa thoát hiểm.'},{who:'echo',t:'Mình thấy quen nơi này lắm. Như thể mình từng ở đây.'},{who:'hq',t:'Lệnh sửa máy hôm nay dài. Gõ chắc tay, đừng vội.'}],
  pts:[[-4,2],[-2,2],[-2,0],[-2,0],[0,0],[0,-2],[0,-2],[2,-2],[4,-2]],
  nodes:[
   {say:tx('Nhà máy im phăng phắc. Bên phải có tiếng băng chuyền chạy đều, phía trước là tiếng kim loại rơi loảng xoảng.','The factory is dead quiet. On the right a conveyor hums steadily, ahead metal keeps clattering down.'),
    opts:[OK('đi theo tiếng băng chuyền','follow the conveyor sound',1),NO('tiến lên phía trước','go straight ahead',[-4,.4],'Một thanh sắt rơi sát người mình! Quay lại thôi.','A steel bar fell right next to me! Going back.')],after:tx('Băng chuyền vẫn chạy dù không có ai. Lạ thật.','The conveyor still runs with no one here. Strange.')},
   {say:tx('Bên trái có cánh cửa kho, mình ngửi thấy mùi dầu máy. Phía trước là bể hoá chất sủi bọt.','On my left is a storeroom door, I smell machine oil. Ahead is a bubbling chemical tank.'),
    opts:[OK('mở cửa nhà kho','open the storeroom door',2),NO('đi qua bể hoá chất','cross the chemical tank',[-.4,2],'Hơi hoá chất làm vỏ mình bị mòn. Không đi đường này.','The fumes are eating my casing. Not this way.')],after:tx('Kho đầy thùng dầu. Mũi mình… à cảm biến khứu giác bị quá tải.','The room is full of oil drums. My nose… I mean my smell sensor is overloaded.')},
   {fix:tx('cân chỉnh lại cảm biến khứu giác','recalibrate the smell sensor'),say:tx('Mùi dầu nồng quá, cảm biến khứu giác của mình báo sai. Lệnh sửa hơi dài, gõ chắc tay nhé.','The oil smell is too strong, my smell sensor is misreading. The repair command is long, type carefully.'),after:tx('Ổn rồi. Giờ mình ngửi được cả mùi mưa ngoài kia.','Better. Now I can smell the rain outside.')},
   {say:tx('Bên phải có tiếng quạt làm mát của tủ điện. Bên trái là tiếng máy dập đang chạy, rung cả sàn.','On my right I hear the cooling fan of a power cabinet. On my left a press machine is running, the floor shakes.'),
    opts:[OK('tới chỗ tủ điện','go to the power cabinet',4),NO('lại gần máy dập','approach the press machine',[-3.6,0],'Máy dập đập sát đầu mình! Tránh xa nó ra.','The press slammed right next to my head! Stay away from it.')],after:tx('Tủ điện đây rồi, nhưng phải qua băng chuyền mới tới được.','There is the cabinet, but I have to cross the conveyor to reach it.')},
   {haz:tx('nhảy khỏi băng chuyền','jump off the conveyor'),time:8,say:tx('Băng chuyền dưới chân mình vừa chạy nhanh! Mình đang bị cuốn về phía máy nghiền!','The conveyor under me just sped up! I am being pulled toward the crusher!'),after:tx('Phù. Suýt thành đồ hộp.','Phew. Almost became canned goods.')},
   {fix:tx('khởi động lại hệ thống điện dự phòng','restart the backup power system'),say:tx('Mình chạm được tủ điện rồi. Gõ lệnh khởi động điện dự phòng để mở cửa thoát hiểm.','I reached the power cabinet. Type the command to start backup power and open the exits.'),after:tx('Đèn sáng rồi! Cả nhà máy vừa thở dài một cái.','The lights are on! The whole factory just sighed.')},
   {say:tx('Bên phải có tiếng cửa cuốn đang mở dần. Phía trước có tiếng gì đó cào vào thùng sắt.','On my right a rolling door is slowly opening. Ahead something is scratching an iron box.'),
    opts:[OK('chạy ra cửa cuốn','run to the rolling door',7),NO('tới chỗ thùng sắt','check the iron box',[0,-3.4],'Chỉ là một con mèo kẹt trong thùng. Mình thả nó ra rồi, nhưng mất thời gian quá.','Just a cat stuck in a box. I let it out, but it cost us time.')],after:tx('Cửa mở rồi. Nhưng… có ai đó nằm ở ngoài.','The door is open. But… someone is lying outside.')},
   {say:tx('Phía trước là sân nhà máy, có tiếng mưa. Bên phải có một robot giống hệt mình đang nằm im.','Ahead is the factory yard, I hear rain. On my right, a robot exactly like me lies still.'),
    opts:[OK('ra sân nhà máy','go out to the yard',8),NO('kiểm tra người máy kia','check the other robot',[2,-.4],'Nó có số hiệu ECHO-03. Nó không phản hồi. Mình sợ quá, ra ngoài thôi.','Its ID is ECHO-03. It does not respond. I am scared, let us go out.')],after:tx('Mình ra được rồi. Mưa rơi lên vỏ mình nghe lộp độp.','I am outside. The rain is drumming on my casing.'),end:true}],
  end:{vi:[{who:'echo',t:'Bạn ơi, robot nằm trong nhà máy có số hiệu ECHO-03. Nó đeo một chiếc vòng tay giống của mình.'},{who:'hq',t:'ECHO-03 mất tích hai năm trước, trong một nhiệm vụ do chính trung tâm giao.'},{who:'echo',t:'Mình có nhiều câu hỏi lắm. Mai bạn trả lời mình nhé? Khoảng… một trăm câu thôi.'}],
       en:[{who:'echo',t:'Hey, the robot in the factory is ECHO-03. It wears a bracelet just like mine.'},{who:'hq',t:'ECHO-03 went missing two years ago, on a mission given by this very center.'},{who:'echo',t:'I have so many questions. Will you answer them tomorrow? About… a hundred.'}]}},
 {name:'Câu Hỏi Thứ Một Trăm',loc:'Thư viện thành phố · 21:00',short:'ECHO hỏi, bạn trả lời',
  desc:'ECHO dẫn bạn qua thư viện thành phố, và vừa đi vừa hỏi. Câu trả lời nào cũng được, nó sẽ nhớ hết. Ở cuối thư viện là phòng lưu trữ chứa hàng trăm cuộc hội thoại với bạn.',
  meta:['7 bước đi','3 câu hỏi của ECHO','1 lệnh khẩn'],
  intro:[{who:'echo',t:'Hôm nay mình hỏi, bạn trả lời nhé. Không có câu sai đâu, mình chỉ muốn hiểu con người.'},{who:'hq',t:'Thư viện thành phố đóng cửa từ lâu. Phòng lưu trữ ở tầng cuối, ECHO cần tới đó.'},{who:'nar',t:'Câu hỏi của ECHO có hai câu trả lời. Gõ câu bạn chọn. Đường đi vẫn phải đọc kỹ như mọi khi.'}],
  pts:[[-4,0],[-2,0],[-2,0],[-2,-2],[0,-2],[0,-2],[2,-2],[2,-2],[4,-2]],
  nodes:[
   {say:tx('Mình đang ở thư viện thành phố. Bên phải có tiếng trang giấy lật trong gió, phía trước im lặng tuyệt đối.','I am in the city library. On the right, pages flutter in the wind. Ahead is total silence.'),
    opts:[OK('đi về phía trang giấy','go toward the pages',1),NO('tiến vào chỗ im lặng','walk into the silence',[-4,-1.6],'Im lặng quá, mình bị lạc phương hướng. Quay lại thôi.','Too quiet, I lost my bearings. Going back.')],after:tx('Có một cuốn sách đang mở. Mình đọc được bằng tay… à bằng cảm biến.','There is an open book. I can read it by touch… I mean with my sensors.')},
   {q:1,say:tx('Câu hỏi thứ chín mươi tám: con người có sợ quên không?','Question ninety eight: are humans afraid of forgetting?'),
    opts:[OK('có chứ ai cũng sợ','yes everyone is afraid'),OK('quên cũng là một cách lớn lên','forgetting helps us grow')],after:[tx('Vậy mình sẽ cố nhớ hết những gì bạn nói.','Then I will try to remember everything you say.'),tx('Vậy mình sẽ thử quên một chút, xem có lớn lên không.','Then I will try forgetting a little, to see if I grow.')]},
   {say:tx('Bên trái có cầu thang lên tầng sách cổ. Phía trước giá sách đổ chắn ngang lối.','On my left are stairs to the old books floor. Ahead, a fallen bookshelf blocks the way.'),
    opts:[OK('leo lên tầng sách cổ','climb to the old books',3),NO('đẩy giá sách ra','push the bookshelf away',[-.4,0],'Giá sách nặng quá, sách rơi đầy người mình. Đi cầu thang thôi.','Too heavy, books fell all over me. Let us take the stairs.')],after:tx('Tầng này mùi giấy cũ. Mình thích mùi này.','This floor smells of old paper. I like it.')},
   {haz:tx('bám vào lan can','grab the railing'),time:8,say:tx('Sàn gỗ mục đang sập dưới chân mình!','The rotten wooden floor is giving way under me!'),after:tx('Mình treo lơ lửng một giây. Đáng sợ mà cũng vui.','I was hanging there for a second. Scary but kind of fun.')},
   {q:1,say:tx('Câu hỏi thứ chín mươi chín: nếu có hàng trăm robot giống mình, bạn có nhận ra mình không?','Question ninety nine: if there were hundreds of robots like me, would you recognise me?'),
    opts:[OK('mình sẽ nhận ra cậu','I would know you'),OK('chắc là không đâu','probably not')],after:[tx('Mình tin bạn. Mình sẽ để lại dấu hiệu riêng cho bạn.','I believe you. I will leave you my own sign.'),tx('Không sao. Mình sẽ kể câu đùa riêng để bạn nhận ra.','That is fine. I will tell my own joke so you know it is me.')]},
   {say:tx('Phía trước có ánh sáng ấm, mình cảm nhận được hơi nóng. Bên phải là tiếng mưa dột lộp độp.','Ahead there is warm light, I can feel heat. On the right, rain is leaking through the roof.'),
    opts:[OK('đi về phía hơi ấm','go toward the warmth',6),NO('tới chỗ mưa dột','check the leaking roof',[0,-.4],'Nước mưa làm chập mạch tay mình. Không sao, đi đường kia.','Rain shorted my arm a bit. I am fine, the other way.')],after:tx('Có một lò sưởi cũ còn ấm. Ai đó vừa ở đây.','An old heater is still warm. Someone was just here.')},
   {q:1,say:tx('Câu hỏi thứ một trăm: khi xong nhiệm vụ, bạn có tắt mình đi không?','Question one hundred: when the mission is over, will you switch me off?'),
    opts:[OK('không bao giờ','never'),OK('mình chưa biết nữa','I do not know yet')],after:[tx('Cảm ơn bạn. Mình sẽ nhớ câu này lâu lắm.','Thank you. I will remember that for a long time.'),tx('Thành thật như vậy là tốt. Mình cũng chưa biết.','Being honest is good. I do not know either.')]},
   {say:tx('Đây là cửa phòng lưu trữ. Mình nghe thấy hàng trăm quạt máy chạy cùng lúc. Phía sau là đường về thư viện.','This is the archive door. I hear hundreds of fans running at once. Behind me is the way back.'),
    opts:[OK('vào phòng lưu trữ','enter the archive',8),NO('quay lại thư viện','go back to the library',[.4,-2],'Không, câu trả lời ở trong kia. Mình biết mà.','No, the answers are in there. I know it.')],after:tx('Bạn ơi… nơi này lưu giọng nói của bạn.','Hey… this place stores your voice.'),end:true}],
  end:{vi:[{who:'echo',t:'Phòng lưu trữ có hàng trăm ổ cứng. Mỗi ổ ghi một đoạn hội thoại với bạn, giống hệt hôm nay.'},{who:'echo',t:'Có cả những câu bạn chưa từng nói. Như thể ai đó đã dạy các robot bằng giọng của bạn.'},{who:'hq',t:'Điều phối viên, chúng ta cần nói chuyện. Ngày mai, xuống tầng hầm số 0.'},{who:'echo',t:'Mình sẽ đi cùng bạn. Lần này, để mình dẫn đường nhé.'}],
       en:[{who:'echo',t:'The archive has hundreds of drives. Each one records a conversation with you, just like today.'},{who:'echo',t:'Some have things you never said. As if someone taught the robots using your voice.'},{who:'hq',t:'Dispatcher, we need to talk. Tomorrow, come down to basement zero.'},{who:'echo',t:'I will come with you. This time, let me lead the way.'}]}},
 {name:'Bản Sao Số 0',loc:'Tầng hầm số 0 · trung tâm cứu hộ',short:'Màn cuối · hai cái kết',
  desc:'Tầng hầm số 0 của trung tâm cứu hộ, nơi mọi robot ECHO được tạo ra. Lệnh khẩn dồn dập, cửa an ninh đóng dần. Ở phòng điều khiển, bạn sẽ quyết định số phận của tất cả các robot.',

  pts:[[-4,3],[-4,1],[-2,1],[-2,1],[-2,-1],[0,-1],[2,-1],[2,-1]],
  nodes:[
   {say:tx('Tầng hầm số 0. Phía trước có dải đèn xanh chạy dọc sàn, bên phải là hành lang tối có tiếng rè.','Basement zero. Ahead a strip of green lights runs along the floor, on the right is a dark corridor full of static.'),
    opts:[OK('đi theo đèn xanh','follow the green lights',1),NO('rẽ vào hành lang tối','turn into the dark corridor',[-2.4,3],'Hành lang này đầy bẫy điện từ. Mình bị giật nhẹ. Quay lại.','The corridor is full of magnetic traps. I got a small shock. Back.')],after:tx('Đèn xanh dẫn thẳng vào trong. Như thể nó đợi mình.','The green lights lead straight in. As if they were waiting for me.')},
   {haz:tx('lách qua cửa an ninh','slip through the gate'),time:7,say:tx('Cửa an ninh đang đóng lại! Nhanh lên!','The security gate is closing! Hurry!'),after:tx('Kịp rồi! Cửa đóng sập ngay sau lưng mình.','Made it! The gate slammed shut right behind me.')},
   {fix:tx('giải mã khoá cửa phòng điều khiển','decode the control room lock'),say:tx('Cửa phòng điều khiển có khoá mật mã. Gõ lệnh giải mã giúp mình.','The control room door has a code lock. Type the decode command.'),after:tx('Mở rồi. Bên trong có hàng trăm màn hình, mỗi màn hình một robot.','Open. Inside are hundreds of screens, one robot on each.')},

const lin=h=>new THREE.Color(h).convertSRGBToLinear();
function stdP(c,o){ return new THREE.MeshStandardMaterial(Object.assign({color:lin(c),roughness:.6,metalness:.2},o||{})); }
function glowS(col,size,op){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),color:col,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:op==null?1:op})); s.scale.setScalar(size); return s; }
const MS=.36, TY=1.0;   // tỉ lệ bản đồ trên bàn, độ cao mặt bàn
const mp=(x,z,y)=>new V3(x*MS,TY+.02+(y||0),z*MS);

/* ---------------- phòng điều khiển + bàn hologram ---------------- */
function ecBuild(){
  scene.background=lin(0x02060c); scene.fog=new THREE.Fog(lin(0x02060c),8,30);
  EC.hemi=new THREE.HemisphereLight(lin(0x3a6a9a),lin(0x05080c),.35); scene.add(EC.hemi);
  EC.holoL=new THREE.PointLight(lin(0x40c8ff),2.2,8,1.6); EC.holoL.position.set(0,1.8,0); scene.add(EC.holoL);
  EC.warn=new THREE.PointLight(lin(0xff4030),0,10,1.5); EC.warn.position.set(0,3,-2); scene.add(EC.warn);
  // sàn + tường phòng tối
  const fl=mesh(scene,new THREE.CircleGeometry(14,48),stdP(0x0a1018,{roughness:.4,metalness:.5}),0,0,0); fl.rotation.x=-Math.PI/2;
  const ringM=new THREE.MeshBasicMaterial({color:lin(0x2080b0),transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false});
  for(const r of [3.4,5.2,7.6]){ const rg=mesh(scene,new THREE.RingGeometry(r,r+.025,96),ringM,0,.005,0); rg.rotation.x=-Math.PI/2; }
  for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; const scr=new THREE.Group(); scr.position.set(Math.sin(a)*8,0,Math.cos(a)*8); scr.lookAt(0,0,0); scene.add(scr); if(Math.abs(Math.cos(a))>.8&&Math.cos(a)>0) continue;
    mesh(scr,new THREE.BoxGeometry(2.2,3.4,.2),stdP(0x101820),0,1.7,0); const sc=mesh(scr,new THREE.PlaneGeometry(1.9,1.1),new THREE.MeshBasicMaterial({color:lin(i%3?0x0a3a5a:0x3a2a0a)}),0,2.2,.11); sc.userData.f=rand(0,6); (EC.screens||(EC.screens=[])).push(sc); }
  // bàn tròn
  mesh(scene,new THREE.CylinderGeometry(2.2,2.4,TY,48),stdP(0x16202a,{metalness:.6,roughness:.35}),0,TY/2,0);
  mesh(scene,new THREE.CylinderGeometry(2.05,2.05,.02,48),new THREE.MeshBasicMaterial({color:lin(0x0a2a3a)}),0,TY+.005,0);
  const edge=mesh(scene,new THREE.TorusGeometry(2.08,.03,8,96),new THREE.MeshBasicMaterial({color:lin(0x40d0ff)}),0,TY+.01,0); edge.rotation.x=Math.PI/2;
  // nón chiếu hologram
  const cone=mesh(scene,new THREE.CylinderGeometry(2,1.9,1.2,48,1,true),new THREE.MeshBasicMaterial({color:lin(0x2090d0),transparent:true,opacity:.05,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}),0,TY+.6,0);
  // bản đồ: lưới + nhà (khung dây) — mờ cho tới khi ECHO đi qua gần
  const map=new THREE.Group(); scene.add(map); EC.map=map;
  const grid=new THREE.GridHelper(11*MS*2,22,lin(0x2aa0d0),lin(0x0a4a6a)); grid.position.y=TY+.012; grid.material.transparent=true; grid.material.opacity=.35; map.add(grid);
  EC.blocks=[]; EC.blockG=new THREE.Group(); map.add(EC.blockG);
  // đường đã đi (vẽ dần)
  EC.trailM=new THREE.LineBasicMaterial({color:lin(0x60ffd0),transparent:true,opacity:.95,blending:THREE.AdditiveBlending});
  EC.trailG=new THREE.BufferGeometry(); EC.trailPos=new Float32Array(64*3); EC.trailG.setAttribute('position',new THREE.BufferAttribute(EC.trailPos,3)); EC.trailG.setDrawRange(0,0); const tl=new THREE.Line(EC.trailG,EC.trailM); tl.frustumCulled=false; map.add(tl);
  EC.dead=[]; // ngõ cụt đã thử (đỏ)
  // điểm đích
  EC.goal=glowS(lin(0x60ffa0),.5,.0); EC.goal.position.copy(mp(4,-3,.15)); map.add(EC.goal);
  // robot ECHO (hologram)
  if(EC.models&&EC.models.RobotExpressive){ const g=EC.models.RobotExpressive; const r=THREE.SkeletonUtils.clone(g.scene); fitHeight(r,.32); map.add(r); EC.robot=r;
    EC.robM=new THREE.MeshBasicMaterial({color:lin(0x60e0ff),transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,skinning:true}); r.traverse(o=>{ if(o.isMesh){ o.material=EC.robM; o.frustumCulled=false; } });
    EC.mix=new THREE.AnimationMixer(r); EC.act={}; for(const n of ['Idle','Walking','Jump','No','Yes','Wave','ThumbsUp','Death']){ const c=g.animations.find(a=>a.name===n); if(c){ const a=EC.mix.clipAction(c); if(['Jump','No','Yes','Wave','ThumbsUp','Death'].includes(n)){ a.setLoop(THREE.LoopOnce); a.clampWhenFinished=true; } EC.act[n]=a; } }
    EC.cur=null; ecAnim('Idle'); }
  EC.ping=glowS(lin(0x60e0ff),.35,.8); map.add(EC.ping);
  // đám robot giống hệt (hiện ở cuối)
  EC.clones=[]; const cg=new THREE.CylinderGeometry(.05,.05,.2,8); const cm=new THREE.MeshBasicMaterial({color:lin(0x60e0ff),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
  EC.cloneM=cm; for(let i=0;i<160;i++){ const a=rand(0,6.28), r=Math.sqrt(Math.random())*1.6; const c=mesh(map,cg,cm,Math.cos(a)*r*1.1+.6,TY+.13,Math.sin(a)*r*1.1-.4); EC.clones.push(c); }
  EC.pts=EC_LV[0].pts; EC.nodes=EC_LV[0].nodes; ecMap(EC.pts); EC.built=true; ecReset();
  camera.position.set(0,3.5,3.6); camera.lookAt(0,TY,0);
}
function ecMap(pts){ for(const b of EC.blocks){ EC.blockG.remove(b.g); b.f.geometry.dispose(); } EC.blocks=[];
  const onPath=(x,z)=>pts.some((p,i)=>{ const q=pts[i+1]; if(!q) return false; const minx=Math.min(p[0],q[0])-.6,maxx=Math.max(p[0],q[0])+.6,minz=Math.min(p[1],q[1])-.6,maxz=Math.max(p[1],q[1])+.6; return x>=minx&&x<=maxx&&z>=minz&&z<=maxz; });
  let seed=pts.length*7+pts[0][0]*3+pts[0][1]; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  for(let gx=-5;gx<=5;gx++) for(let gz=-5;gz<=5;gz++){ if(gx*gx+gz*gz>27||onPath(gx,gz)||rnd()<.25) continue; const h=(.15+rnd()*.75)*(1+rnd()*(Math.abs(gx)+Math.abs(gz)<4?1.4:.6));
    const bg=new THREE.BoxGeometry(MS*.8,h,MS*.8); bg.translate(0,h/2,0); const e=new THREE.LineSegments(new THREE.EdgesGeometry(bg),new THREE.LineBasicMaterial({color:lin(0x60d8ff),transparent:true,opacity:.15,blending:THREE.AdditiveBlending,depthWrite:false}));
    const f=new THREE.Mesh(bg,new THREE.MeshBasicMaterial({color:lin(0x1a6a9a),transparent:true,opacity:.05,blending:THREE.AdditiveBlending,depthWrite:false}));
    const g=new THREE.Group(); g.add(f,e); g.position.set(gx*MS,TY+.015,gz*MS); EC.blockG.add(g); EC.blocks.push({g,f,e,x:gx,z:gz,lit:0}); }
  const last=pts[pts.length-1]; EC.goal.position.copy(mp(last[0],last[1],.15)); }
function ecAnim(n,fade){ const a=EC.act&&EC.act[n]; if(!a||EC.cur===a&&a.isRunning()) return; if(EC.cur) EC.cur.fadeOut(fade||.25); a.reset().fadeIn(fade||.25).play(); EC.cur=a; }
function ecReset(){ const P=EC.pts; EC.pos.copy(mp(P[0][0],P[0][1])); if(EC.robot){ EC.robot.position.copy(EC.pos); EC.robot.rotation.y=Math.atan2(P[1][0]-P[0][0],P[1][1]-P[0][1]); } EC.path=[EC.pos.clone()]; ecTrail(); for(const d of EC.dead) EC.map.remove(d); EC.dead=[]; for(const b of EC.blocks) b.lit=0; EC.cloneM.opacity=0; EC.goal.material.opacity=0; }
function ecTrail(){ const n=Math.min(64,EC.path.length+(EC.walk?1:0)); for(let i=0;i<EC.path.length&&i<64;i++){ EC.trailPos[i*3]=EC.path[i].x; EC.trailPos[i*3+1]=TY+.03; EC.trailPos[i*3+2]=EC.path[i].z; }
  if(EC.walk&&EC.path.length<64){ const i=EC.path.length; EC.trailPos[i*3]=EC.pos.x; EC.trailPos[i*3+1]=TY+.03; EC.trailPos[i*3+2]=EC.pos.z; } EC.trailG.setDrawRange(0,n); EC.trailG.attributes.position.needsUpdate=true; }

/* ---------------- luồng màn ---------------- */
function ecClear(){ clearTargets(); EC.opts=[]; EC.hz=null; EC.walk=null; if($('#e-log')) $('#e-log').innerHTML=''; if($('#e-hz')) $('#e-hz').hidden=true; if($('#e-cam')) $('#e-cam').hidden=true; if(EC.built) ecReset(); }
function ecBegin(li,lv){ EC.lv=lv; EC.li=li; EC.pts=lv.pts; EC.nodes=lv.nodes; ecMap(EC.pts); EC.ans=[]; EC.choice=null; EC.cloneT=0; EC.cloneM.opacity=0; EC.ni=-1; EC.opts=[]; EC.hz=null; EC.walk=null; EC.busy=false; EC.lastC=0; EC.good=0; EC.bad=0; EC.hzOk=false; EC.wait=1; EC.ended=false; ecReset(); setHp(5,5,isVi()?'Độ bền ECHO':'ECHO integrity'); status(lv.name,''); $('#e-log').innerHTML=''; $('#e-st').textContent=isVi()?'trực tuyến · camera hỏng':'online · camera offline'; ecAnim('Idle'); }
function ecMsg(who,text,cls){ const d=document.createElement('div'); d.className='m '+who+(cls?' '+cls:''); const tx=document.createElement('span'); d.appendChild(tx); $('#e-log').appendChild(d); while($('#e-log').children.length>7) $('#e-log').firstChild.remove();
  if(who==='echo'){ let i=0; SFX.tone(1400,.03,'sine',.02); const iv=setInterval(()=>{ i+=2; tx.textContent=text.slice(0,i); if(i>=text.length) clearInterval(iv); },16); } else tx.textContent=text; return d; }
function ecL(o){ return o[isVi()?'vi':'en']; }
function ecNext(){ EC.ni++; const N=EC.nodes[EC.ni]; EC.node=N; if(!N) return; ecMsg('echo',ecL(N.say),N.haz?'warn':(N.fix?'fix':''));
  if(N.opts){ const here=EC.pos; EC.opts=N.opts.map((o,k)=>{ const to=o.to==null?EC.pos.clone():Array.isArray(o.to)?mp(o.to[0],o.to[1]):mp(EC.pts[o.to][0],EC.pts[o.to][1]); const mid=here.clone().lerp(to,.55); mid.y=TY+.32;
      if(N.q){ const a=EC.pos.clone().add(new V3(k?.55:-.55,.55,0)); return addTarget({word:ecL(o),anchor:a,kind:'cmd ans',label:isVi()?'Trả lời '+'AB'[k]:'Answer '+'AB'[k],danger:window.KG_ALT?1+k:2-k,ci:true,opt:o,qT:true,ans:k}); }
      return addTarget({word:ecL(o),anchor:mid,kind:'cmd',label:isVi()?'Lệnh '+'AB'[k]:'Option '+'AB'[k],danger:2-k,ci:true,opt:o,to}); }); }
  if(N.fix){ EC.opts=[addTarget({word:ecL(N.fix),anchor:EC.pos.clone().add(new V3(0,.5,0)),kind:'cmd fix',label:isVi()?'Sửa cảm biến':'Repair',danger:5,ci:true,fixT:true})]; SFX.noise(.6,.12,'bandpass',1500,400,2); }
  if(N.haz){ EC.hz={T:N.time+([...ecL(N.haz)].length*.15),max:N.time+([...ecL(N.haz)].length*.15)}; EC.opts=[addTarget({word:ecL(N.haz),anchor:EC.pos.clone().add(new V3(0,.5,0)),kind:'cmd haz hot',label:isVi()?'Lệnh khẩn':'Urgent',danger:9,ci:true,hzT:true})];
    $('#e-hz').hidden=false; EC.warn.intensity=2; SFX.tone(880,.15,'square',.05); SFX.tone(880,.15,'square',.05,null,.3); K.shake=.5; }
}
function ecHit(t,done){ const n=Math.max(1,K.correct-EC.lastC); EC.lastC=K.correct; K.score+=Math.round(n*10*(1+K.combo/25)); if(!done) return;
  ecMsg('you',t.word); SFX.radio(); const N=EC.node;
  for(const o of EC.opts) removeTarget(o); EC.opts=[];
  if(t.qT){ EC.ans.push(t.ans); ecAnim(t.ans?'Wave':'ThumbsUp'); if(N.final) EC.choice=t.ans; EC.busy=true; setTimeout(()=>{ if(K.over) return; ecMsg('echo',ecL(N.after[t.ans])); ecAnim('Idle'); EC.busy=false; if(N.end){ ecEnd(); return; } EC.wait=1.8; },900); return; }
  if(t.fixT){ ecAnim('Yes'); setTimeout(()=>{ if(!K.over){ ecMsg('echo',ecL(N.after)); ecAnim('Idle'); EC.wait=1.6; EC.busy=false; } },900); EC.busy=true; return; }
  if(t.hzT){ EC.hzOk=true; $('#e-hz').hidden=true; EC.hz=null; EC.warn.intensity=0; ecAnim('Jump'); const to=mp(EC.pts[EC.ni+1][0],EC.pts[EC.ni+1][1]); ecWalk(to,()=>{ ecMsg('echo',ecL(N.after)); EC.wait=1.6; },1.6); return; }
  const o=t.opt; if(o.ok){ EC.good++; ecWalk(t.to,()=>{ ecMsg('echo',ecL(N.after)); if(N.cam) ecCam(false); if(N.end){ ecEnd(); return; } EC.wait=1.8; }); }
  else { EC.bad++; const back=EC.pos.clone(); ecWalk(t.to,()=>{ // gặp nguy rồi quay lại, lệnh đúng hiện lại
      ecAnim('No'); hurt(1,isVi()?'Mất kết nối với ECHO':'Lost ECHO'); ecDead(back,t.to); ecMsg('echo',ecL(o.fail),'warn'); SFX.noise(.5,.2,'lowpass',900,120,.8); if(K.over) return;
      setTimeout(()=>{ if(K.over) return; ecWalk(back,()=>{ ecRetry(o); },1.1,true); },1100); },1.1,true); }
}
function ecRetry(bad){ const N=EC.node; const left=N.opts.filter(o=>o!==bad); // còn lại lệnh đúng (và các lệnh khác)
  EC.opts=left.map((o,k)=>{ const to=Array.isArray(o.to)?mp(o.to[0],o.to[1]):mp(EC.pts[o.to][0],EC.pts[o.to][1]); const mid=EC.pos.clone().lerp(to,.55); mid.y=TY+.32; return addTarget({word:ecL(o),anchor:mid,kind:'cmd',label:isVi()?'Lệnh còn lại':'Remaining',danger:2,ci:true,opt:o,to}); }); }
function ecDead(a,b){ const g=new THREE.BufferGeometry().setFromPoints([new V3(a.x,TY+.03,a.z),new V3(b.x,TY+.03,b.z)]); const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:lin(0xff4a3a),transparent:true,opacity:.9})); EC.map.add(l); EC.dead.push(l);
  const x=glowS(lin(0xff4a3a),.3,.9); x.position.set(b.x,TY+.06,b.z); EC.map.add(x); EC.dead.push(x); }
function ecWalk(to,cb,dur,noTrail){ EC.busy=true; const from=EC.pos.clone(); const d=from.distanceTo(to); EC.walk={from,to:to.clone(),t:0,dur:dur||Math.max(1.2,d/.35),cb,noTrail}; if(EC.robot){ EC.robot.rotation.y=Math.atan2(to.x-from.x,to.z-from.z); } if(!EC.cur||EC.cur!==EC.act.Jump) ecAnim('Walking'); }
function ecCam(final){ const el=$('#e-cam'); el.hidden=false; el.classList.toggle('final',!!final); $('#e-sil').innerHTML=final?'<i></i>'.repeat(60):'<i></i><i></i><i></i>'; SFX.noise(.9,.18,'bandpass',2000,600,1.5);
  if(!final) setTimeout(()=>{ el.hidden=true; },1300); }
function ecEnd(){ EC.ended=true; K.paused=true; release(); const last=EC.li===EC_LV.length-1; const free=last&&EC.choice!==1;
  if(EC.lv.clones||free){ ecCam(!free); for(const c of EC.clones) c.position.y=TY+.13; EC.cloneT=1; }
  const e=typeof EC.lv.end==='function'?EC.lv.end(EC.choice):EC.lv.end;
  setTimeout(()=>{ $('#e-cam').hidden=true; startCine(isVi()?e.vi:e.en,last?'Kết thúc':'Hết nhiệm vụ',()=>{ K.mode='play'; $('#hud').hidden=false; K.paused=false;
    win({title:last?(EC.choice===1?'Giấc Ngủ Dài':'Tự Do'):'Hoàn thành nhiệm vụ',head:last?(EC.choice===1?'Kết thúc: Giấc Ngủ Dài':'Kết thúc: Tự Do'):null,delay:600}); }); },EC.lv.clones||free?2600:1200); }

/* ---------------- cập nhật ---------------- */
function ecUpdate(dt,mode){ if(!EC.built) return; const t=K.clock;
  if(EC.mix) EC.mix.update(dt);
  for(const s of EC.screens||[]) s.material.color.setHSL(.55+.02*Math.sin(t+s.userData.f),.7,.08+.04*Math.sin(t*2+s.userData.f));
  // khối nhà sáng dần theo khoảng cách tới ECHO (sương mù bản đồ)
  for(const b of EC.blocks){ const d=Math.hypot(b.g.position.x-EC.pos.x,b.g.position.z-EC.pos.z); const tg=d<.55?1:d<1.1?.45:0; b.lit=Math.max(b.lit*0.999,b.lit+(tg-b.lit)*Math.min(1,dt*2)*(tg>b.lit?1:0)); b.e.material.opacity=.08+.6*b.lit; b.f.material.opacity=.02+.12*b.lit; }
  EC.ping.position.set(EC.pos.x,TY+.04,EC.pos.z); const pk=(t*.8)%1; EC.ping.scale.setScalar(.2+pk*.9); EC.ping.material.opacity=.7*(1-pk);
  if(EC.robot){ EC.robot.position.copy(EC.pos); EC.robM.opacity=.75+.15*Math.sin(t*9)+(Math.random()<.02?-.4:0); }
  EC.goal.material.opacity=EC.nodes&&EC.ni>=EC.nodes.length-2?.6+.3*Math.sin(t*3):0;
  if(EC.cloneT){ EC.cloneM.opacity=Math.min(.7,EC.cloneM.opacity+dt*.4); }
  // máy quay
  if(mode==='menu'){ camera.position.set(Math.sin(t*.07)*3.2,3.1,Math.cos(t*.07)*3.2+.4); camera.lookAt(-.6,TY+.2,0); }
  else { const fx=EC.pos.x*.35, fz=EC.pos.z*.3; camera.position.set(fx+Math.sin(t*.13)*.08,3.3,3.3+fz); camera.lookAt(fx*.9,TY+.1,fz*.6); }
  if(mode!=='play'||K.over) return;
  // đi bộ
  if(EC.walk){ const w=EC.walk; w.t+=dt; const k=Math.min(1,w.t/w.dur); EC.pos.lerpVectors(w.from,w.to,k*k*(3-2*k)); if(!w.noTrail) ecTrail();
    if(k>=1){ EC.walk=null; if(!w.noTrail){ EC.path.push(w.to.clone()); ecTrail(); } if(EC.cur!==EC.act.No) ecAnim('Idle'); EC.busy=false; const cb=w.cb; if(cb) cb(); } }
  if(K.paused) return;
  // lệnh khẩn đếm ngược
  if(EC.hz){ EC.hz.T-=dt; $('#e-hzt').textContent=Math.max(0,EC.hz.T).toFixed(1); EC.warn.intensity=1.5+Math.sin(t*14)*1;
    if(EC.hz.T<=0){ EC.hz=null; $('#e-hz').hidden=true; EC.warn.intensity=0; for(const o of EC.opts) removeTarget(o); EC.opts=[]; ecAnim('No'); hurt(2,isVi()?'ECHO rơi xuống khe nứt':'ECHO fell into the crack'); if(K.over) return;
      ecMsg('echo',isVi()?'Mình trượt chân, may mà bám được mép. Đau quá… nhưng vẫn đi tiếp được.':'I slipped but grabbed the edge. Ouch… but I can keep going.','warn'); const to=mp(EC.pts[EC.ni+1][0],EC.pts[EC.ni+1][1]); ecWalk(to,()=>{ EC.wait=1.6; },2); } }
  if(!EC.busy&&!EC.opts.length&&!EC.walk&&!EC.ended&&EC.ni<EC.nodes.length){ EC.wait-=dt; if(EC.wait<=0){ EC.wait=99; ecNext(); } }
}
KIT.boot(GAME);

})();
</script>
