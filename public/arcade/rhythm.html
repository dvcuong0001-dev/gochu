<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>rhythm</title>
<link rel="stylesheet" href="fonts/rhythm.css">
<style>
/* ===== Tuhoc Typing · bộ khung game 3D (mỗi game đổi biến màu/font ở :root của riêng nó) ===== */
:root{ --vh:1vh; --vw:1vw;
  --bg:#05070c; --ink:#eef4ff; --muted:#9aaccb; --acc:#5ef0ff; --acc2:#ffb547; --bad:#ff4d5e; --good:#6dff9e;
  --oncyc:#041018; --glass:rgba(8,12,20,.76); --line:rgba(150,200,255,.2); --tagbg:rgba(6,12,20,.82);
  --display:'Chakra Petch',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif; --mono:'JetBrains Mono','Cascadia Mono',Consolas,ui-monospace,monospace;
  --rad:0px; --glow:rgba(94,240,255,.55); --dtrans:uppercase; --dls:.03em;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#tags,#fxl,#lockl{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#lines line{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 6;opacity:.75;filter:drop-shadow(0 0 4px var(--glow))}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#kb{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0}
.eyebrow{font:600 11px/1.3 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}

/* ---- nhãn chữ trên mục tiêu ---- */
.tag{position:absolute;left:0;top:0;transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform;transition:opacity .15s}
.tag .w{font:700 17px/1.32 var(--mono);padding:4px 9px 3px;background:var(--tagbg);border:1px solid var(--line);color:var(--ink);white-space:pre;border-radius:var(--rad);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tag .w b{color:var(--acc);text-shadow:0 0 10px var(--glow)}
.tag .w .nx{background:var(--acc);color:var(--oncyc);border-radius:2px}
.tag .d{font:600 10.5px/1.2 var(--mono);color:#c9d3e3;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 3px #000}
.tag.on .w{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 22px var(--glow)}
.tag.hot .w{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad),0 0 20px rgba(255,77,94,.5)}
.tag.hot .d{color:var(--bad)}
.tag.gold .w{border-color:var(--acc2);color:#fff3d6}
.tag.gold .d{color:var(--acc2)}
.tag.bad .w{border-color:var(--bad);background:rgba(40,6,10,.85)}
.tag.bad .d{color:var(--bad)}
.tag.boss .w{font-size:21px;border-color:var(--bad)}
.tag.big .w{font-size:24px;padding:6px 12px 4px}
.tag.dim{opacity:.4}

/* ---- tâm ngắm ---- */
#lock{position:absolute;left:0;top:0;width:100px;height:100px;--rc:var(--acc)}
#lock.hot{--rc:var(--bad)}
#lock svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px var(--glow))}
#lock svg *{fill:none;stroke:var(--rc);vector-effect:non-scaling-stroke}
#lock .ro path{stroke-width:2.2}
#lock .ri circle{stroke-width:1;stroke-dasharray:2 5;opacity:.7}
#lock .pg{stroke-width:3;stroke-linecap:round;stroke-dasharray:0 100}
#lock .br path{stroke-width:2.4}
#lock .ro,#lock .ri,#lock .br{transform-box:view-box;transform-origin:center}

/* ---- hiệu ứng chữ ---- */
.pop{position:absolute;left:0;top:0;font:700 18px/1.2 var(--display);color:var(--acc2);text-shadow:0 0 12px rgba(0,0,0,.6);animation:rise .9s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.pop.good{color:var(--good)} .pop.bad{color:var(--bad)} .pop.big{font-size:28px}
@keyframes rise{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -54px}}
.hm{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;animation:hm .25s ease-out forwards}
.hm i{position:absolute;left:50%;top:50%;width:9px;height:2px;background:#fff;box-shadow:0 0 8px var(--glow)}
.hm i:nth-child(1){transform:translate(-50%,-50%) rotate(45deg) translateX(-11px)}
.hm i:nth-child(2){transform:translate(-50%,-50%) rotate(135deg) translateX(-11px)}
.hm i:nth-child(3){transform:translate(-50%,-50%) rotate(225deg) translateX(-11px)}
.hm i:nth-child(4){transform:translate(-50%,-50%) rotate(315deg) translateX(-11px)}
@keyframes hm{0%{opacity:1;scale:.7}40%{opacity:1;scale:1.1}100%{opacity:0;scale:1.3}}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .tl{position:absolute;left:18px;top:14px;max-width:calc(46*var(--vw))}
#h-stat{font:700 22px/1.25 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:4px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#h-sub{font:500 12.5px/1.45 var(--mono);color:var(--muted);margin-top:2px}
#hud .btns{display:flex;gap:6px;margin-top:10px;pointer-events:auto}
.hb{cursor:pointer;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad)}
.hb:hover{border-color:var(--acc)}
#hud .tr{position:absolute;right:18px;top:12px;text-align:right}
/* 14/10/2026: nút về app ngay khi đang chơi (chỉ hiện trong app), nằm bên trái khối điểm */
#hud .tr .h-exit{position:absolute;right:calc(100% + 16px);top:3px;pointer-events:auto;display:inline-flex;align-items:center;gap:7px;padding:8px 13px 8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,20,.74);color:#fff;font:600 13px/1 var(--body);letter-spacing:0;text-transform:none;white-space:nowrap;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
#hud .tr .h-exit[hidden]{display:none}
#hud .tr .h-exit svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
#hud .tr .h-exit:hover,#hud .tr .h-exit:focus-visible{background:#c42b1c;border-color:#ff8a7a;outline:none}
#h-score{font:700 34px/1.1 var(--display);font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#h-combo{font:700 14px/1.3 var(--display);color:var(--acc2);min-height:18px;letter-spacing:.05em}
#h-xp{font:600 12px/1.4 var(--mono);color:var(--good)}
#h-extra{font:600 11.5px/1.5 var(--mono);color:var(--acc2);margin-top:4px;max-width:calc(34*var(--vw))}
#hud .bl{position:absolute;left:18px;bottom:16px}
#h-hpl{display:block;font:600 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#h-hp{display:flex;gap:4px}
#h-hp i{width:20px;height:8px;background:var(--acc);box-shadow:0 0 8px var(--glow);transform:skewX(-20deg);border-radius:calc(var(--rad)/3)}
#h-hp i.off{background:rgba(255,255,255,.12);box-shadow:none}
#h-hp.low i:not(.off){background:var(--bad);box-shadow:0 0 8px rgba(255,77,94,.7)}
#hud .br{position:absolute;right:18px;bottom:16px;font:500 12.5px/1.3 var(--mono);color:var(--muted)}
#hud .br b{color:var(--ink)}
#bossbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);width:min(520px,calc(60*var(--vw)));pointer-events:none}
#bossbar .bn{display:flex;justify-content:space-between;font:600 12px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bad);margin-bottom:5px}
#bossbar .bn small{color:var(--muted)}
#bossbar .bt{height:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,77,94,.35);border-radius:var(--rad);overflow:hidden}
#bossbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--acc2));transition:width .25s}

/* ---- thanh chữ đang gõ ---- */
#tbar{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;pointer-events:none;padding:10px 16px 9px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(6px)}
#tbar .who{font:600 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
#tbar .wd{font:700 30px/1.36 var(--mono);white-space:pre;padding:2px 12px;border:1px solid var(--line);border-radius:var(--rad)}
#tbar .wd b{color:var(--acc);text-shadow:0 0 12px var(--glow)}
#tbar .wd u{text-decoration:none;background:var(--acc);color:var(--oncyc);padding:0 3px;border-radius:2px}
#tbar .wd i{font-style:normal;color:var(--ink);opacity:.85}
#tbar .keys{display:flex;gap:6px;justify-content:center}
#tbar .words{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;max-width:min(560px,calc(100vw - 40px))}
#tbar .words span{font:600 20px/1 var(--body);padding:7px 11px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:var(--rad)}
#tbar .words b{color:var(--acc);font-weight:800}
#tbar .keys span{font:700 18px/1 var(--mono);min-width:34px;padding:8px 9px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:var(--rad)}
#tbar .hint{margin-top:7px;font-size:12.5px;line-height:1.5;color:var(--muted)}
#tbar .hint .tk{color:var(--acc2)}
#tbar .hint .bad{color:var(--bad)}
#tbar.err{animation:shake .25s}
@keyframes shake{25%{translate:-5px 0}50%{translate:5px 0}75%{translate:-3px 0}}

/* ---- banner / radio ---- */
#banner{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s}
#banner.show{opacity:1}
#banner h2{font:700 clamp(30px,calc(5*var(--vw)),58px)/1.18 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);text-shadow:0 0 30px var(--glow),0 3px 18px rgba(0,0,0,.7)}
#banner p{margin-top:8px;font:600 13px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc2);text-shadow:0 2px 10px #000}
#comm{position:fixed;left:18px;bottom:62px;width:min(420px,calc(100% - 36px));display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--rad);opacity:0;translate:-12px 0;transition:opacity .25s,translate .25s;pointer-events:none;backdrop-filter:blur(6px)}
#comm.show{opacity:1;translate:0 0}
#comm.warn{border-left-color:var(--bad)}
.av{width:46px;height:46px;flex:none;border-radius:calc(var(--rad) + 4px);overflow:hidden;background:rgba(255,255,255,.05)}
.av svg{width:100%;height:100%;display:block}
.nm{font:700 11px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.tx{font-size:14px;line-height:1.5;margin-top:3px}

/* ---- cutscene ---- */
#cine{position:fixed;inset:0;z-index:20}
#cine .bar{position:absolute;left:0;right:0;height:calc(11*var(--vh));background:#000}
#cine .bar.t{top:0} #cine .bar.b{bottom:0}
#cine .loc{position:absolute;left:28px;top:calc(11*var(--vh) + 18px);font:600 12px/1.4 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--acc);text-shadow:0 2px 8px #000}
#cine .dlg{position:absolute;left:50%;bottom:calc(11*var(--vh) + 22px);transform:translateX(-50%);width:min(760px,calc(100% - 32px));display:flex;gap:16px;padding:16px 18px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);cursor:pointer;backdrop-filter:blur(8px)}
#cine .av{width:64px;height:64px}
#cine .tx{font-size:16.5px;line-height:1.6;min-height:52px}
#cine .nx{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.skip{cursor:pointer;background:none;border:1px solid var(--line);padding:6px 10px;color:var(--muted);font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:var(--rad)}
.skip:hover{color:var(--ink);border-color:var(--acc)}

/* ---- menu ---- */
#menu{position:fixed;inset:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr;pointer-events:none}
#menu>*{pointer-events:auto}
.m-left{display:flex;flex-direction:column;gap:14px;padding:22px 18px 18px 24px;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.42) 70%,transparent);min-height:0}
.m-left h1{font:700 clamp(28px,calc(3*var(--vw)),40px)/1.12 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:6px;text-shadow:0 0 24px var(--glow)}
.m-left h1 em{font-style:normal;color:var(--acc)}
.m-tag{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:6px;max-width:330px}
.m-total{font:600 11.5px/1.4 var(--mono);color:var(--muted);margin-top:8px}
.lvlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.lv{cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 12px;background:rgba(10,14,22,.62);border:1px solid var(--line);border-radius:var(--rad)}
.lv:hover{border-color:var(--acc)}
.lv[aria-pressed="true"]{border-color:var(--acc);background:rgba(20,30,44,.86);box-shadow:inset 3px 0 0 var(--acc)}
.lv .no{font:700 19px/1 var(--display);color:var(--acc);text-align:center}
.lv .nm2{display:block;font:600 14.5px/1.3 var(--body)}
.lv .sub{display:block;font:500 11px/1.4 var(--mono);color:var(--muted);margin-top:2px}
.lv.locked{opacity:.5}
.st{display:flex;gap:2px}
.st i{width:11px;height:11px;background:rgba(255,255,255,.15);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.st i.on{background:var(--acc2)}
.m-set{display:grid;gap:7px;padding-top:10px;border-top:1px solid var(--line)}
.m-set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.m-set .row>span{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:66px}
.chip{cursor:pointer;font:600 12.5px/1.2 var(--body);padding:7px 10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:var(--rad)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--oncyc);border-color:var(--acc)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.m-detail{position:absolute;right:24px;bottom:24px;width:min(500px,calc(100% - 48px));padding:22px;background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);backdrop-filter:blur(10px)}
.m-detail h2{font:700 clamp(26px,calc(3*var(--vw)),38px)/1.15 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);margin-top:6px}
.m-detail .desc{margin-top:10px;font-size:14.5px;line-height:1.6;color:#d4deee}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font:600 11.5px/1.3 var(--mono);padding:5px 8px;border:1px solid var(--line);color:var(--muted);border-radius:var(--rad)}
.meta span.a{color:var(--acc2);border-color:rgba(255,181,71,.4)}
.meta span.g{color:var(--good);border-color:rgba(109,255,158,.35)}
.go{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{cursor:pointer;font:700 15px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--acc);background:var(--acc);color:var(--oncyc);border-radius:var(--rad)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.lnk{cursor:pointer;background:none;border:0;color:var(--acc);font:500 13px/1.4 var(--body);text-decoration:underline;text-underline-offset:3px}
.fine{margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--muted)}
kbd{font:600 11px/1 var(--mono);padding:2px 5px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.06)}
#loadmsg{font:500 12.5px/1.4 var(--mono);color:var(--muted)}

/* ---- bảng kết quả ---- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(2,4,8,.55);z-index:25}
.panel{width:min(600px,100%);max-height:calc(100*var(--vh) - 24px);overflow-y:auto;background:var(--glass);border:1px solid var(--line);padding:26px;border-radius:var(--rad);backdrop-filter:blur(10px)}
.panel h1{margin-top:10px;font:700 clamp(30px,calc(4.4*var(--vw)),50px)/1.14 var(--display);letter-spacing:var(--dls);text-transform:var(--dtrans);text-shadow:0 0 26px var(--glow)}
.stars{display:flex;gap:8px;margin-top:14px}
.stars i{width:34px;height:34px;background:rgba(255,255,255,.12);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i.on{background:var(--acc2);filter:drop-shadow(0 0 10px var(--acc2))}
.xpbox{margin-top:14px;padding:10px 12px;border:1px solid rgba(109,255,158,.35);font-size:14px;line-height:1.55;border-radius:var(--rad)}
.xpbox b{color:var(--good)}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{border:1px solid var(--line);padding:9px 10px;border-radius:var(--rad)}
.stats span{display:block;font:600 10px/1.3 var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stats b{display:block;margin-top:4px;font:700 21px/1.2 var(--display);font-variant-numeric:tabular-nums}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font:600 13px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--acc);z-index:40}

@media (max-width:639px){
  #menu{grid-template-columns:1fr}
  .m-left{background:rgba(0,0,0,.6)}
  .lvlist{max-height:calc(34*var(--vh))}
  .m-detail{position:relative;right:auto;bottom:auto;margin:0 16px 16px;width:auto}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  #tbar{bottom:96px} #tbar .wd{font-size:22px}
}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }

#imewarn{position:fixed;left:50%;top:72px;transform:translate(-50%,-8px);z-index:60;max-width:min(620px,calc(100% - 32px));padding:12px 16px;border-radius:10px;background:#2b1406;border:1px solid #ffb547;color:#ffe6c2;font:500 14px/1.5 system-ui,'Segoe UI',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#imewarn.show{opacity:1;transform:translate(-50%,0)}
#imewarn b{color:#ffcf7a}

/* Nút về app: góc phải trên như nút đóng quen thuộc */
.m-exit{position:absolute;top:16px;right:18px;z-index:5;pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:9px 15px 9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,20,.74);color:#fff;font:600 14px/1 var(--body);letter-spacing:0;text-transform:none;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
.m-exit[hidden]{display:none}
.m-exit svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.m-exit:hover,.m-exit:focus-visible{background:#c42b1c;border-color:#ff8a7a;outline:none}
body.g-orbit.in-app .m-set{top:66px}
body.g-orbit.in-app .m-detail{top:176px}

.xpbox .xpn{display:block;margin-top:3px;font-size:.92em;opacity:.82}

   Đang chạy mà dưới ~38 khung/giây (2 lần đo liền, mỗi lần 1,5 giây) → tắt phát sáng, rồi hạ dần độ phân giải 3D tới 50%; máy khoẻ lại thì tăng dần. */

const GPU_WEAK=!navigator.webdriver&&/Intel.*HD Graphics(?! [5-9]\d\d\b)|HD Graphics (4\d\d|50[05]|610)\b|UHD Graphics 60[05]\b|GMA|SwiftShader|llvmpipe|Basic Render/i.test(GPU_RAW);

const dpr=()=>Math.min(window.devicePixelRatio||1,Q==='high'?1.5:1)*RS;
let composer=null,bloom=null,finalPass=null;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.05,2000);
scene.add(camera);
function initPost(P){
  if(!R) return; P=Object.assign({exposure:.8,bloom:[.7,.6,1.0],ca:.0005,grain:.03,vig:1,shadow:[.88,1,1.1],high:[1.06,1,.92]},P||{});

    uniforms:{tDiffuse:{value:null},uTime:{value:0},uExposure:{value:P.exposure},uCA:{value:P.ca},uGrain:{value:P.grain},uHurt:{value:0},uVig:{value:P.vig},uFlash:{value:0},uSh:{value:new V3(...P.shadow)},uHi:{value:new V3(...P.high)}},
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader:`uniform sampler2D tDiffuse; uniform float uTime,uExposure,uCA,uGrain,uHurt,uVig,uFlash; uniform vec3 uSh,uHi; varying vec2 vUv;
      vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
      float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      void main(){ vec2 uv=vUv; vec2 d=uv-.5; float r=length(d); float ca=uCA*(.3+r*2.4);
        vec3 c=vec3(texture2D(tDiffuse,uv+d*ca).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-d*ca).b);

  el.style.zoom=UIZ<.999?String(UIZ):''; el.innerHTML='<b>Bộ gõ tiếng Việt đang bật</b> (Unikey / EVKey) nên phím bị đổi thành chữ có dấu. Hãy chuyển bộ gõ sang chế độ <b>E</b> rồi gõ tiếp'+(vi?'. Game đã có sẵn Telex.':'.');
  el.classList.add('show'); clearTimeout(imeT); imeT=setTimeout(()=>el.classList.remove('show'),7000); }
addEventListener('keydown',e=>{
  if(GFX.open) return;
  if(e.key==='F11'&&HOST){ e.preventDefault(); HOST.postMessage({type:'fullscreen'}); return; }
  if(K.mode==='cine'){ if(e.key==='Escape'){ e.preventDefault(); endCine(); } else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); cineNext(); } return; }
  if(K.mode==='menu'){ if(e.key==='Enter'&&(document.activeElement===document.body||document.activeElement.classList.contains('lv'))&&!$('#d-start').disabled){ e.preventDefault(); startLevel(false); } return; }
  if(K.mode!=='play') return;
  if(K.over){ if(e.key==='Enter'&&!$('#over').hidden){ e.preventDefault(); ($('#o-next').hidden?$('#o-again'):$('#o-next')).click(); } return; }
  if(e.key==='Backspace'){ bsAt=performance.now(); bsLock=K.lock; }
  if(e.key.length===1&&e.key.charCodeAt(0)>127&&!e.ctrlKey&&!e.altKey){ e.preventDefault();
    // 13/10/2026: tiếng Việt — nhận luôn chữ có dấu do Unikey/EVKey gửi (bộ gõ xoá lùi rồi gõ lại chữ có dấu), không bắt tắt bộ gõ
    if(isVi()&&!G.keyMode&&!(K.lock&&K.lock.plain)){ lastKeyAt=performance.now(); typeChar(e.key); return; }
    imeWarn(isVi()); if(!isVi()&&performance.now()-bsAt<150&&bsLock&&bsLock.alive&&!K.lock){ K.lock=bsLock; drawTag(bsLock); drawBar(); } return; }
  if(G.onKeyDown&&G.onKeyDown(e)) return;
  if(e.key==='Backspace'&&isVi()&&K.lock&&!K.lock.plain){ e.preventDefault(); K.lastMiss=false; viBack(K.lock.vs); K.lock.typed=(K.lock.vs.done||0)+[...(K.lock.vs.comp||'')].length; drawTag(K.lock); drawBar(); return; }
  if(e.key==='Escape'||e.key==='Backspace'){ e.preventDefault(); release(); return; }
  if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey) return;
  e.preventDefault(); lastKeyAt=performance.now(); typeChar(G.keyMode?e.key.toLowerCase():e.key);
});

const RS_MIN=.5, RS_TOP=()=>Q==='high'?1:.85;
const pf={n:0,acc:0,good:0,bad:0}; let perfNoted=false;
function perfNote(){ if(perfNoted) return; perfNoted=true; let el=document.getElementById('perfnote'); if(!el){ el=document.createElement('div'); el.id='perfnote'; el.setAttribute('role','status'); document.body.appendChild(el); }
  const z=Math.max(.5,Math.min(1,innerWidth/1280,innerHeight/720)); el.style.zoom=z<.999?String(z):'';
  el.innerHTML=(GPU_NAME?'Máy bạn dùng card đồ hoạ <b>'+esc(GPU_NAME)+'</b>, cấu hình thấp':'Máy bạn cấu hình thấp')+' so với game 3D. Game đã tự chuyển sang <b>đồ hoạ mức thấp</b> để chơi mượt, hình sẽ hơi mờ.';
  el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),9000); }
function perfTick(raw,active){ if(!R||navigator.webdriver||document.hidden||raw>1.5||!active||GFX.open){ pf.n=0; pf.acc=0; return; } pf.acc+=raw; pf.n++; if(pf.acc<1.5) return; const fps=pf.n/pf.acc; pf.n=0; pf.acc=0;
  // Cao/Nhẹ chọn tay: giữ cố định; Cao mà giật nặng thì gợi ý chuyển Tự động (1 lần)
  if(GFX.mode!=='auto'){ if(GFX.mode==='high'&&fps<32){ if(++pf.bad>=2){ pf.bad=0; gfxLagHint(); } } else pf.bad=0; return; }
  if(fps<38){ pf.good=0; if(++pf.bad<2) return; pf.bad=0;
    if(bloom&&bloom.enabled){ bloom.enabled=false; } else if(RS>RS_MIN+.001){ RS=Math.max(RS_MIN,Math.round((RS-.15)*100)/100); onResize(); } else return;
    perfNote(); }
  else { pf.bad=0; if(fps>56){ if(++pf.good>=3){ pf.good=0; if(RS<RS_TOP()-.001){ RS=Math.min(RS_TOP(),Math.round((RS+.1)*100)/100); onResize(); } else if(Q==='high'&&bloom&&!bloom.enabled) bloom.enabled=true; } } else pf.good=0; } }
/* đổi mức đồ hoạ ngay, không tải lại trang: dựng lại khâu hậu kỳ (MSAA/bloom), độ nét, đổ bóng */
function kitGfxApply(eff){ if(!R) return; const ch=Q!==eff; Q=eff; RS=Q==='high'?1:(GPU_WEAK?.75:.85); pf.n=pf.acc=pf.good=pf.bad=0;
  if(ch&&composer){ const old=composer, ob=bloom, ofp=finalPass; initPost(G.post);
    if(ofp&&finalPass) for(const k in ofp.uniforms){ const v=ofp.uniforms[k].value; if(finalPass.uniforms[k]&&typeof v==='number') finalPass.uniforms[k].value=v; }
    try{ old.renderTarget1.dispose(); old.renderTarget2.dispose(); if(ob&&ob.dispose) ob.dispose(); }catch(e){}
    scene.traverse(o=>{ if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ m.needsUpdate=true; }); }); }
  if(bloom) bloom.enabled=Q==='high'; onResize(); }
function frame(now){ requestAnimationFrame(frame); const raw=(now-last)/1000; perfTick(raw,K.ready&&(K.mode==='play'||K.mode==='menu')); const dt=Math.min(.05,raw); last=now; step(K.hold?0:dt*K.timeScale,dt); if(R&&composer) composer.render(); }
function step(dt,rdt){
  rdt=rdt==null?dt:rdt; K.clock+=dt;
  if(K.mode==='play'&&!K.over&&!K.paused){ K.time+=dt; }
  if(G.update) G.update(dt,K.mode);
  updateFX(dt);
  if(K.mode==='play'){ updateTags(rdt); K.barErrT=Math.max(0,(K.barErrT||0)-rdt); K.barT=(K.barT||0)-rdt; if(K.barT<=0){ K.barT=.25; drawBar(); } hudTick(); }
  if(K.shake>0&&!REDUCE){ camera.position.x+=rand(-1,1)*K.shake*.1; camera.position.y+=rand(-1,1)*K.shake*.1; }
  K.shake=Math.max(0,K.shake-rdt*2.4); K.hurtFx=Math.max(0,K.hurtFx-rdt*1.6);
  if(finalPass){ finalPass.uniforms.uTime.value=K.clock; finalPass.uniforms.uHurt.value=K.hurtFx; }
}

function winTex(){ if(TEXC.win) return TEXC.win; TEXC.win=tex(cv(64,128,(x,w,h)=>{ x.fillStyle='#000'; x.fillRect(0,0,w,h); for(let j=4;j<h-4;j+=8) for(let i=4;i<w-4;i+=8) if(Math.random()<.45){ x.fillStyle=`rgba(255,255,255,${rand(.3,1)})`; x.fillRect(i,j,4,5); } }),1,1); return TEXC.win; }

/* ---------------- âm nhạc tự sinh ---------------- */
const mtof=m=>440*Math.pow(2,(m-69)/12);
function vox(type,freq,t,dur,vol,opt){ const c=SFX.ctx; if(!c) return; opt=opt||{}; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t); if(opt.glide) o.frequency.exponentialRampToValueAtTime(opt.glide,t+dur*.6); if(opt.detune) o.detune.value=opt.detune;
  let node=o; if(opt.lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(opt.lp,t); if(opt.lpEnv) f.frequency.exponentialRampToValueAtTime(opt.lpEnv,t+dur); f.Q.value=opt.q||1; o.connect(f); node=f; }
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+(opt.a||.008)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); node.connect(g); g.connect(opt.dest||SFX.music); o.start(t); o.stop(t+dur+.05); }
function drum(kind,t,v){ const c=SFX.ctx; if(!c) return; v=v||1;
  if(kind==='k'){ vox('sine',150,t,.32,.9*v,{glide:42,dest:SFX.music}); vox('square',90,t,.03,.15*v,{dest:SFX.music}); }
  else if(kind==='s'){ SFX.noise(.18,.4*v,'bandpass',1800,900,.7,t,SFX.music,true); vox('triangle',220,t,.1,.25*v,{glide:150}); }
  else if(kind==='h'){ SFX.noise(.045,.16*v,'highpass',7000,9000,.6,t,SFX.music,true); }
  else if(kind==='c'){ SFX.noise(.9,.25*v,'highpass',5000,3000,.4,t,SFX.music,true); } }
function makeChart(tr){ const notes=[], spb=60/tr.bpm, st=spb/4, keys=tr.keys.split(''), cols=keys.map(k=>keyInfo(k).col);
  const intro=2, rng=(()=>{ let s=tr.bpm*7+tr.bars; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; })();
  const PAT=[[0,8],[0,4,8,12],[0,4,6,8,12],[0,3,6,8,12,14],[0,2,4,6,8,10,12,14]];
  let cur=Math.floor(rng()*keys.length);
  for(let bar=intro;bar<tr.bars-1;bar++){ const sec=Math.floor((bar-intro)/((tr.bars-intro)/4)); let dens=tr.density[Math.min(3,sec)]; if(bar%8===7) dens=Math.max(0,dens-1);
    if(tr.words){ const w=WORDLIST[Math.floor(rng()*WORDLIST.length)]; const steps=w.length<=4?[0,4,8,12]:w.length===5?[0,2,4,8,12]:[0,2,4,6,8,12]; const ws=bar*16*st;
      w.split('').forEach((ch,i)=>{ if(i<steps.length) notes.push({time:ws+steps[i]*st,key:ch,word:w,wi:i}); }); continue; }
    const pat=PAT[Math.min(PAT.length-1,dens)];
    for(const s of pat){ let nxt; for(let tries=0;tries<6;tries++){ const j=Math.floor(rng()*keys.length); if(Math.abs(cols[j]-cols[cur])<=3&&j!==cur){ nxt=j; break; } } if(nxt==null) nxt=Math.floor(rng()*keys.length); cur=nxt;
      notes.push({time:bar*16*st+s*st,key:keys[cur]}); } }
  notes.forEach(n=>{ const ki=keyInfo(n.key); n.col=ki.col; n.row=ki.row; n.judged=false; n.gem=null; });
  return notes; }
function songTime(){ return SFX.ctx?SFX.ctx.currentTime-RH.startAt:0; }
function startSong(li,tr){

  RH.startAt=(c?c.currentTime:0)+1.2; RH.nextStep=RH.startAt; RH.step=0; RH.endAt=tr.bars*16*(60/tr.bpm/4); RH.playing=true;
  for(const g of RH.gems){ g.g.visible=false; g.note=null; }
  RH.active=new Set(tr.keys.split('').map(k=>keyInfo(k).col)); updateCaps(tr);
  status(tr.name,tr.bpm+' BPM · '+RH.total+' nốt'); drawEnergy(); judgeShow('',''); $('#r-word').textContent='';
  say('linh',li===0?'Đếm nhịp nhé: một, hai, ba, bốn… vào!':'Vào bài! Giữ nhịp trống làm chuẩn.');

function updateCaps(tr){ const keys=tr?tr.keys:''; RH.caps.forEach((cp,c)=>{ const ks=['top','home','bot'].map(r=>ROWS[r][c]).filter(k=>keys.includes(k)); const lbl=ks.join(' ');
    cp.top.material.map=capTex(lbl||'',c); cp.top.material.needsUpdate=true; cp.body.material.emissive.setRGB(ks.length?.12:.02,.03,ks.length?.18:.04); }); }
function capTex(lbl,c){ const k='cap'+lbl; if(TEXC[k]) return TEXC[k]; TEXC[k]=new THREE.CanvasTexture(cv(160,240,(x,w,h)=>{ x.clearRect(0,0,w,h); const parts=lbl.split(' ').filter(Boolean); x.textAlign='center'; x.textBaseline='middle';
    parts.forEach((p,i)=>{ const row=keyInfo(p).row; x.font=`800 ${parts.length>1?64:96}px Saira, sans-serif`; x.fillStyle=row==='top'?'#ff8ae6':row==='bot'?'#ffd36b':'#8af6ff'; x.shadowColor=x.fillStyle; x.shadowBlur=14; x.fillText(p===';'?';':p.toUpperCase(),w/2,h/2+(i-(parts.length-1)/2)*72); }); })); return TEXC[k]; }
function scheduleMusic(){ const c=SFX.ctx, tr=RH.song; if(!c||!tr) return; const spb=60/tr.bpm, st=spb/4;
  while(RH.nextStep<c.currentTime+.15){ const t=RH.nextStep, s=RH.step, bar=Math.floor(s/16), b16=s%16; if(t-RH.startAt>RH.endAt+.1){ RH.nextStep+=st; RH.step++; continue; }
    const chord=CH[tr.prog[bar%tr.prog.length]], root=tr.key-12;
    if(bar>=1||b16>=8){ if(b16%4===0) drum('k',t,b16===0?1:.85); if(tr.bpm>=110&&b16===10) drum('k',t,.6);
      if(b16===4||b16===12) drum('s',t); if(b16%2===0) drum('h',t,b16%4===2?1:.6); if(bar%8===0&&b16===0&&bar>0) drum('c',t); }
    if(b16%2===0&&bar>=1){ const n=root+chord[0]+(b16%4===2?12:0); vox('sawtooth',mtof(n),t,st*1.7,.13,{lp:520,lpEnv:220,q:4}); }
    if(b16===0){ for(const iv of chord){ vox('sawtooth',mtof(tr.key+iv),t,spb*3.8,.035,{lp:1400,lpEnv:500,a:.25,detune:rand(-8,8)}); vox('sawtooth',mtof(tr.key+iv),t,spb*3.8,.03,{lp:1400,lpEnv:500,a:.25,detune:rand(8,14)}); } }
    if(b16%4===0&&s>0){ const beat=Math.floor((t-RH.startAt)/spb+.001); setTimeout(()=>{ RH.beatPulse=1; },Math.max(0,(t-c.currentTime)*1000)); }
    RH.nextStep+=st; RH.step++; } }
function leadNote(n,t){ const tr=RH.song; const deg=MINOR_PENTA[n.col]+(n.row==='top'?12:n.row==='bot'?-12:0); vox('square',mtof(tr.key+12+deg),t,.22,.06,{lp:3200,lpEnv:900,q:2}); vox('triangle',mtof(tr.key+24+deg),t,.3,.05); }
function previewTrack(i){ if(RH.preview){ clearInterval(RH.preview.iv); RH.preview=null; } if(i<0||!SFX.ctx||!SFX.on||K.mode!=='menu') return; const tr=TRACKS[i]; const c=SFX.ctx; let t=c.currentTime+.1, s=0; const spb=60/tr.bpm, st=spb/4;
  RH.preview={iv:setInterval(()=>{ if(K.mode!=='menu'){ previewTrack(-1); return; } while(t<c.currentTime+.2&&s<64){ const b16=s%16, chord=CH[tr.prog[Math.floor(s/16)%tr.prog.length]]; if(b16%4===0) drum('k',t,.5); if(b16%2===0) drum('h',t,.4); if(b16===0) chord.forEach(iv=>vox('sawtooth',mtof(tr.key+iv),t,spb*3.5,.02,{lp:1200,lpEnv:400,a:.2})); if(b16%4===2) vox('square',mtof(tr.key+12+MINOR_PENTA[(s*3)%10]),t,.2,.025,{lp:2600}); t+=st; s++; } if(s>=64) previewTrack(-1); },60)}; }

/* ---------------- chấm điểm ---------------- */
const WIN={p:.06,g:.12,o:.18};
function accPct(){ const j=RH.judge, tot=j.p+j.g+j.o+j.m; return tot?(j.p+j.g*.8+j.o*.5)/tot:0; }
function gradeOf(a){ return a>=.95?'S':a>=.88?'A':a>=.75?'B':a>=.6?'C':'D'; }
function judgeShow(txt,cls){ const el=$('#r-judge'); if(!el) return; el.className=''; void el.offsetWidth; el.textContent=txt; if(txt) el.className='show '+cls; }
function pressKey(ch){ if(!RH.playing) return; const info=keyInfo(ch); const st=songTime();
  if(info){ const cp=RH.caps[info.col]; cp.press=1; }
  let best=null,bd=1e9; for(const n of RH.notes){ if(n.judged) continue; if(n.time-st>WIN.o+.25) break; if(n.key!==ch) continue; const d=Math.abs(n.time-st); if(d<bd){ bd=d; best=n; } }
  if(best&&bd<=WIN.o){ best.judged=true; const q=bd<=WIN.p?'p':bd<=WIN.g?'g':'o'; RH.judge[q]++; good(); RH.energy=Math.min(100,RH.energy+(q==='p'?2.5:1.5));
    const mult=1+Math.min(3,Math.floor(K.combo/20)*.5); K.score+=Math.round((q==='p'?300:q==='g'?200:100)*mult);
    leadNote(best,SFX.ctx.currentTime); hitFx(best,q); judgeShow(q==='p'?'PERFECT':q==='g'?'GREAT':'GOOD','j-'+q);
    if(best.word&&best.wi===best.word.length-1){ K.score+=500; pop(new V3(laneX(best.col),2,0),'+'+best.word.toUpperCase(),'good'); }
  } else { bad(); RH.energy-=[2.5,3,4,4,4][K.li|0]||4; if(info){ RH.errT[info.col]=1; } judgeShow(info?'SAI PHÍM':'SAI PHÍM','j-x'); SFX.tone(110,.15,'sawtooth',.08,70); if(RH.energy<=0) lose('Mất nhịp — bài dừng'); }
  drawEnergy(); }
function hitFx(n,q){ const x=laneX(n.col); const p=new V3(x,.6,HIT_Z); const col=ROWCOL[n.row];
  sparks(p,q==='p'?28:16,7,col.clone().multiplyScalar(.7),1.2,{floor:0}); ring(p,UPV,q==='p'?1.8:1.3,col.clone().multiplyScalar(.35),.35); sprite(p,1,2,.22,col.clone().multiplyScalar(.8));
  const cp=RH.caps[n.col]; cp.flash=1; cp.pil.material.color.copy(col).multiplyScalar(.5); RH.beatPulse=Math.max(RH.beatPulse,.6);
  if(n.gem){ n.gem.g.visible=false; n.gem.note=null; n.gem=null; } }
function drawEnergy(){ const el=$('#r-energy .eq'); if(!el) return; const n=24, on=Math.round(RH.energy/100*n); if(el.childElementCount!==n) el.innerHTML='<i></i>'.repeat(n); [...el.children].forEach((b,i)=>{ b.className=i<on?(RH.energy<30?'lo':i>n*.7?'hi':''):'off'; }); }

/* ---------------- vòng lặp ---------------- */
function rhythmUpdate(dt,mode){
  if(!RH.built) return; const t=K.clock;
  RH.beatPulse=Math.max(0,RH.beatPulse-dt*3.2); const bp=RH.beatPulse;
  RH.sun.material.uniforms.uT.value=t; RH.sun.material.uniforms.uB.value=bp; RH.sky.material.uniforms.uB.value=bp; RH.halo.material.opacity=.8+bp*.3;
  const scroll=(RH.playing?songTime():t)*SPEED; RH.hw.material.uniforms.uOff.value=scroll; RH.grid.material.uniforms.uOff.value=scroll; RH.grid.material.uniforms.uB.value=bp; RH.hw.material.uniforms.uB.value=bp;
  if(bloom) bloom.strength=.7+bp*.25; RH.pl.intensity=2.5+bp*3;
  const lane=RH.hw.material.uniforms.uLane.value, act=RH.hw.material.uniforms.uAct.value;
  RH.caps.forEach((cp,c)=>{ cp.press=Math.max(0,(cp.press||0)-dt*8); cp.flash=Math.max(0,(cp.flash||0)-dt*3); RH.errT[c]=Math.max(0,RH.errT[c]-dt*3);
    cp.g.position.y=cp.y-cp.press*.14; cp.body.material.emissive.setRGB(.05+cp.flash*.45+RH.errT[c]*1.2,.02+cp.flash*.25,.08+cp.flash*.5); cp.pil.material.opacity=cp.flash*.12; lane[c]=Math.max(cp.flash,cp.press*.5); act[c]=RH.active&&RH.active.has(c)?1:0; });
  if(mode==='menu'||mode==='cine'){ camera.position.set(Math.sin(t*.2)*3,8+Math.sin(t*.3),13); camera.lookAt(0,2,-40); if(!RH.playing) RH.beatPulse=Math.max(RH.beatPulse,(Math.sin(t*Math.PI*2*1.5)>.92)?.5:0); return; }
  camera.position.set(mx*1.2,7-my*.4+bp*.05,11); camera.lookAt(mx*2,0,-20);
  if(mode!=='play'||!RH.playing) return;
  scheduleMusic(); const st=songTime(), tr=RH.song;
  // viên pha lê
  for(const n of RH.notes){ if(n.judged) continue; const dtn=n.time-st; if(dtn>LOOK) break;
    if(!n.gem){ const g=RH.gems.find(x=>!x.note); if(!g) continue; g.note=n; n.gem=g; g.g.visible=true; const col=ROWCOL[n.row]; g.m.material.color.copy(col).multiplyScalar(.35); g.m.material.emissive.copy(col).multiplyScalar(.75); g.gl.material.color.copy(col); g.lt.material.map=letterTex(n.key,n.row==='top'?'#ff5ad8':n.row==='bot'?'#ffc23a':'#45e8ff'); g.lt.material.needsUpdate=true; }
    const z=HIT_Z-dtn*SPEED; n.gem.g.position.set(laneX(n.col),.75+Math.max(0,-dtn)*-2,z); n.gem.m.rotation.y=t*3+n.col; const near=clamp(1-Math.abs(dtn)/.35,0,1); n.gem.gl.scale.setScalar(2.4+near*1.6);
    if(dtn<-WIN.o){ n.judged=true; RH.judge.m++; K.combo=0; RH.energy-=[5,6,7,8,8][K.li|0]||8; judgeShow('MISS','j-m'); n.gem.g.visible=false; n.gem.note=null; n.gem=null; drawEnergy(); if(RH.energy<=0){ lose('Mất nhịp — bài dừng'); return; } } }
  // nhãn từ (màn chung kết)
  if(tr.words){ const nx=RH.notes.find(n=>!n.judged&&n.time-st<1.6); const w=nx?nx.word:''; if(w!==RH.wordShown){ RH.wordShown=w; $('#r-word').innerHTML=w?w.split('').map((c,i)=>`<b data-i="${i}">${esc(c)}</b>`).join(''):''; }
    if(nx){ const el=$('#r-word'); [...el.children].forEach((b,i)=>b.classList.toggle('done',i<nx.wi)); } }
  // tiến độ
  const pr=clamp(st/RH.endAt,0,1); const fg=$('#r-prog .fg'); if(fg) fg.style.strokeDasharray=(pr*100).toFixed(1)+' 100'; const tm=$('#r-time'); if(tm){ const left=Math.max(0,RH.endAt-st); tm.textContent=Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0'); }
  const cb=$('#r-combo'); if(cb){ cb.querySelector('b').textContent=K.combo>=4?K.combo:''; cb.classList.toggle('on',K.combo>=4); }
  if(st>RH.endAt+.4&&!RH.notes.some(n=>!n.judged)){ RH.playing=false; const a=accPct(), gd=gradeOf(a); const stars=1+(a>=.88?1:0)+(a>=.95?1:0); K.extra.grade=gd; win({stars,title:'Hạng '+gd,delay:1800}); }
}

KIT.boot(GAME);

})();
